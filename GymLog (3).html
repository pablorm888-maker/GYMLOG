<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0d0f">
<title>GymLog</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0f;--bg2:#141416;--bg3:#1c1c20;--bg4:#242428;
  --border:#2a2a30;--border2:#363640;
  --text:#f0eff4;--text2:#9999aa;--text3:#55555f;
  --accent:#7c6cff;--accent-glow:rgba(124,108,255,0.15);
  --green:#3ecf8e;--green-dim:rgba(62,207,142,0.1);
  --amber:#f5a623;--amber-dim:rgba(245,166,35,0.1);
  --red:#ff5f5f;--red-dim:rgba(255,95,95,0.1);
  --radius:10px;--radius-lg:14px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden}
body{padding-bottom:70px}

/* ── NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,13,15,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:0;z-index:200;height:56px}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:none;font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.3px;color:var(--text3);cursor:pointer;padding:8px 0;transition:.2s;text-transform:uppercase}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{transition:.2s;opacity:.4}
.nav-btn.active svg{opacity:1}

/* ── LAYOUT ── */
.container{max-width:540px;margin:0 auto;padding:18px 14px 16px}
.page-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
.app-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--text);letter-spacing:-0.5px}
.app-title em{color:var(--accent);font-style:normal}
.page-sub{font-size:10px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}

/* ── BUTTONS ── */
.btn{width:100%;padding:14px;border-radius:var(--radius);border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.2px}
.btn:active{transform:scale(.97)}
.btn+.btn{margin-top:8px}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 20px var(--accent-glow)}
.btn-success{background:var(--green-dim);color:var(--green);border:1px solid rgba(62,207,142,.3)!important}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,95,95,.3)!important}
.btn-ghost{background:transparent;color:var(--text3);border:1px solid var(--border)!important}
.btn-sm{padding:8px 14px;font-size:12px;width:auto}
/* floating action bar at bottom of gym page */
.action-bar{position:sticky;bottom:64px;background:var(--bg);padding:10px 0 4px;z-index:10;border-top:1px solid var(--border);margin-top:14px}

/* ── DAY TABS ── */
.day-tabs{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{flex-shrink:0;padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:.15s;white-space:nowrap}
.day-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── WORKOUT HEADER ── */
.workout-header{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px}
.workout-day-name{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;margin-bottom:2px}
.workout-day-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.workout-day-sub{font-size:11px;color:var(--text3);margin-left:15px}
.workout-stats{display:flex;gap:20px;margin-top:12px}
.stat-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--text);line-height:1}
.stat-label{font-size:9px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.timer-live{color:var(--green)}

/* ── REST BANNER ── */
.rest-banner{background:var(--bg2);border:1px solid var(--amber);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rest-left{}
.rest-lbl{font-size:9px;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.rest-time{font-family:'DM Mono',monospace;font-size:30px;color:var(--amber);line-height:1}
.rest-right{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.rest-adj{display:flex;gap:4px}
.radj{padding:5px 8px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:11px;cursor:pointer;font-family:'DM Mono',monospace;transition:.1s}
.radj:active{border-color:var(--amber);color:var(--amber)}
.rest-skip{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:11px;cursor:pointer}

/* ── EXERCISE CARD ── */
.ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:8px;overflow:hidden}
.ex-progress-bar{height:2px;background:var(--border)}
.ex-progress-fill{height:100%;background:var(--green);transition:width .4s}
.ex-header{display:flex;align-items:center;gap:10px;padding:12px 13px;cursor:pointer;user-select:none}
.ex-left-bar{width:2px;height:28px;border-radius:2px;flex-shrink:0}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-meta{font-size:10px;color:var(--text3);margin-top:2px}
.ex-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ex-swap-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.ex-swap-btn:active{border-color:var(--accent);color:var(--accent)}
.ex-chevron{color:var(--text3);transition:transform .2s;font-size:14px}
.ex-chevron.open{transform:rotate(180deg)}

/* ── SETS TABLE ── */
.sets-area{padding:0 13px 12px}
.prev-tag{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);margin-bottom:8px;padding:3px 8px;background:var(--bg3);border-radius:5px;display:inline-block}
.sets-header{display:grid;grid-template-columns:22px 1fr 1fr 64px 26px;gap:5px;padding-bottom:5px;border-bottom:1px solid var(--border);margin-bottom:4px}
.sets-header span{font-size:9px;color:var(--text3);text-align:center;letter-spacing:.3px;font-weight:500;text-transform:uppercase}
.sets-header span:first-child{text-align:left}
.set-row{display:grid;grid-template-columns:22px 1fr 1fr 64px 26px;gap:5px;align-items:center;padding:3px 0}
.set-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);text-align:center}
.set-input{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:7px 4px;font-family:'DM Mono',monospace;font-size:13px;color:var(--text);text-align:center;width:100%;outline:none;-moz-appearance:textfield;transition:.15s}
.set-input::-webkit-outer-spin-button,.set-input::-webkit-inner-spin-button{-webkit-appearance:none}
.set-input:focus{border-color:var(--accent);background:var(--bg4)}
.set-input:disabled{opacity:.35}
.set-prev{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);text-align:center}
.set-done-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;margin:auto}
.set-done-btn.done{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.set-del-btn{opacity:.3;cursor:pointer;background:none;border:none;color:var(--text2);font-size:14px;transition:.15s;margin:auto;display:flex;align-items:center;justify-content:center}
.set-del-btn:active{opacity:1;color:var(--red)}
.add-set-row{display:flex;align-items:center;gap:6px;padding:7px 0 2px;cursor:pointer;color:var(--text3);font-size:12px;background:none;border:none;font-family:'DM Sans',sans-serif;transition:.15s}
.add-set-row:active{color:var(--accent)}
.ex-note{padding:9px 13px;background:var(--bg3);border-top:1px solid var(--border);font-size:11px;color:var(--text3);line-height:1.5;border-left:2px solid var(--accent)}

/* ── SWAP MODAL LIBRARY ── */
.lib-search{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;margin-bottom:10px}
.lib-search:focus{border-color:var(--accent)}
.lib-ex-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:var(--radius);cursor:pointer;transition:.15s;border:1px solid transparent}
.lib-ex-item:hover,.lib-ex-item:active{background:var(--bg3);border-color:var(--border)}
.lib-ex-name{font-size:13px;color:var(--text);font-weight:500}
.lib-ex-tags{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.lib-tag{font-size:9px;padding:2px 6px;border-radius:20px;background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.lib-tag.primary{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.lib-section-title{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 5px;font-weight:500}
.lib-current-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--green-dim);color:var(--green);border:1px solid var(--green)}

/* ── HISTORY ── */
.hist-empty{text-align:center;padding:50px 20px;color:var(--text3);font-size:13px;line-height:1.6}
.hist-session{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:8px}
.hist-session-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.hist-day-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.hist-date{font-size:10px;color:var(--text3);margin-top:1px}
.hist-del-btn{padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:10px;cursor:pointer;transition:.15s}
.hist-del-btn:active{border-color:var(--red);color:var(--red)}
.hist-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.hist-pill{font-size:10px;padding:3px 8px;border-radius:20px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.hist-pill.a{background:var(--accent-glow);color:var(--accent);border-color:rgba(124,108,255,.3)}
.hist-ex-row{display:flex;justify-content:space-between;padding:3px 0;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border)}
.hist-ex-row:last-child{border-bottom:none}
.hist-ex-sets{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3)}

/* ── PROGRESS ── */
.seg{display:flex;background:var(--bg3);border-radius:var(--radius);padding:3px;gap:2px;margin-bottom:14px}
.seg-btn{flex:1;padding:7px 4px;border-radius:8px;border:none;background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg-btn.active{background:var(--bg2);color:var(--text);border:1px solid var(--border)}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px}
.chart-card-title{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.4px}
.chart-wrap{position:relative;height:150px}
.body-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.body-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.body-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:9px 10px;font-family:'DM Mono',monospace;font-size:14px;color:var(--text);outline:none;width:100%;transition:.15s}
.body-input:focus{border-color:var(--accent)}
.body-hist-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.body-hist-row:last-child{border-bottom:none}
.body-hist-date{color:var(--text3);font-size:10px}
.body-hist-val{font-family:'DM Mono',monospace;color:var(--text)}
.body-hist-del{background:none;border:none;color:var(--text3);font-size:14px;cursor:pointer;opacity:.3;transition:.15s;line-height:1}
.body-hist-del:active{opacity:1;color:var(--red)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo-thumb{aspect-ratio:1;border-radius:var(--radius);overflow:hidden;position:relative;background:var(--bg3);border:1px solid var(--border);cursor:pointer}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-date-lbl{position:absolute;bottom:0;left:0;right:0;padding:4px;font-size:9px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));text-align:center}
.photo-del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);border:none;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.photo-add-cell{aspect-ratio:1;border-radius:var(--radius);border:1px dashed var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;background:var(--bg3);transition:.15s}
.photo-add-cell:active{border-color:var(--accent)}
.photo-add-icon{font-size:20px;opacity:.5}
.photo-add-lbl{font-size:10px;color:var(--text3)}

/* ── EXPORT ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.stat-card-val{font-family:'DM Mono',monospace;font-size:20px;color:var(--text);margin-bottom:2px}
.stat-card-lbl{font-size:10px;color:var(--text3)}
.exp-section-title{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;margin-top:14px}
.exp-row{display:flex;gap:7px;margin-bottom:0}
.exp-btn{flex:1;padding:12px 8px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.exp-btn:active{transform:scale(.97)}
.exp-btn.g{border-color:rgba(62,207,142,.35);color:var(--green);background:var(--green-dim)}
.exp-btn.p{border-color:rgba(124,108,255,.35);color:var(--accent);background:var(--accent-glow)}
.exp-btn.r{border-color:rgba(255,95,95,.35);color:var(--red);background:var(--red-dim)}
.info-box{font-size:11px;color:var(--text3);line-height:1.6;padding:12px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);margin-top:12px}

/* ── TOAST / MODAL / VIEWER ── */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:9px 16px;border-radius:20px;font-size:12px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:20px;width:100%;max-width:540px;transform:translateY(100%);transition:transform .25s ease;max-height:88vh;overflow-y:auto}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-hdr{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;line-height:1;padding:0}
.fin-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.fin-row:last-of-type{border-bottom:none}
.fin-lbl{color:var(--text2)}
.fin-val{font-family:'DM Mono',monospace;color:var(--text)}
.photo-viewer{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:400;align-items:center;justify-content:center;display:none}
.photo-viewer.open{display:flex}
.photo-viewer img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:var(--radius)}
.pv-close{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}

/* ── SVG ICONS ── */
svg.icon{display:inline-block;vertical-align:middle;flex-shrink:0}
</style>
</head>
<body>
<div class="container" id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal-overlay" onclick="handleOvClick(event)">
  <div class="modal"><div id="modal-content"></div></div>
</div>
<div class="photo-viewer" id="photo-viewer">
  <button class="pv-close" onclick="closePV()">✕</button>
  <img id="pv-img" src="" alt="">
</div>
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-gym" onclick="setPage('gym')">
    <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16M18 4v16M3 8h3M18 8h3M3 16h3M18 16h3M6 12h12"/></svg>
    Entreno
  </button>
  <button class="nav-btn" id="nav-history" onclick="setPage('history')">
    <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
    Historial
  </button>
  <button class="nav-btn" id="nav-progress" onclick="setPage('progress')">
    <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Progreso
  </button>
  <button class="nav-btn" id="nav-export" onclick="setPage('export')">
    <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    Exportar
  </button>
</nav>

<script>
// ════════════════════════════════════════════════════════════════════
// EXERCISE LIBRARY — alternatives for each slot
// ════════════════════════════════════════════════════════════════════
const LIBRARY = {
  // TORSO — PUSH
  press_pecho:      [{id:'tA1_a',name:'Press en máquina plano',muscle:'Pecho',type:'compound',note:'Posición estándar. Codos a 70°.'},{id:'tA1_b',name:'Press en máquina inclinado',muscle:'Pecho sup.',type:'compound',note:'Mayor activación clavicular.'},{id:'tA1_c',name:'Press en polea cruzada baja',muscle:'Pecho',type:'compound',note:'Tensión constante en todo el rango.'},{id:'tA1_d',name:'Aperturas en máquina (peck deck)',muscle:'Pecho',type:'isolation',note:'Aislamiento máximo de pectorales.'}],

// ════════════════════════════════════════════════════════════════════
// STORAGE  (versioned key gl3_)
// ════════════════════════════════════════════════════════════════════
const gs = k=>{try{return JSON.parse(localStorage.getItem('gl3_'+k))}catch{return null}};
const gw = (k,v)=>localStorage.setItem('gl3_'+k,JSON.stringify(v));

// Load/save routine from storage so user modifications persist
function getRoutine(){
  const saved = gs('routine');
  if(saved && Array.isArray(saved) && saved.length === 4) return saved;
  return JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
}
function saveRoutine(r){ gw('routine', r); }

// ════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════
let ROUTINE = getRoutine();

let S = {
  page:'gym', dayIdx:0,
  sessionActive:false, sessionStart:null, sessionSets:{},
  restActive:false, restRemaining:0, restTimer:null,
  workoutTimer:null, workoutElapsed:0,
  openEx:{},
  progressTab:'weight',
  chartInstances:{},
};

const savedSesh = gs('activeSession');
if(savedSesh){
  S.dayIdx = savedSesh.dayIdx;
  S.sessionActive = true;
  S.sessionStart = savedSesh.sessionStart;
  S.sessionSets = savedSesh.sessionSets;
  S.workoutElapsed = Math.floor((Date.now()-savedSesh.sessionStart)/1000);
}

// ════════════════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════════════════
const fmt = s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const fmtD = ts=>new Date(ts).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
const fmtDs = ts=>new Date(ts).toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
const mk = (tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;};

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function openModal(html){
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
function handleOvClick(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}
function setPage(p){S.page=p;render();}

function exColor(ex){
  if(ex.type==='compound') return'var(--accent)';
  if(ex.type==='isolation') return'var(--green)';
  return'var(--amber)';
}
function getPrev(exId){
  const h=gs('history')||[];
  for(let i=h.length-1;i>=0;i--){
    if(h[i].sets&&h[i].sets[exId]){
      const d=h[i].sets[exId].filter(s=>s.done&&s.weight);
      if(d.length){return`Último: ${Math.max(...d.map(s=>parseFloat(s.weight)||0))}kg`;}
    }
  }
  return null;
}
function getPrevSet(exId,idx){
  const h=gs('history')||[];
  for(let i=h.length-1;i>=0;i--){
    if(h[i].sets&&h[i].sets[exId]&&h[i].sets[exId][idx]){
      const s=h[i].sets[exId][idx];
      if(s.weight&&s.reps)return`${s.weight}×${s.reps}`;
    }
  }
  return'—';
}
function initSets(exId,n){
  if(!S.sessionSets[exId]) S.sessionSets[exId]=Array.from({length:n},()=>({weight:'',reps:'',done:false}));
}
function saveSesh(){
  if(S.sessionActive) gw('activeSession',{dayIdx:S.dayIdx,sessionStart:S.sessionStart,sessionSets:S.sessionSets});
}
function countDone(){
  let done=0,total=0;
  ROUTINE[S.dayIdx].exercises.forEach(ex=>{
    (S.sessionSets[ex.id]||[]).forEach(s=>{total++;if(s.done)done++;});
  });
  return{done,total};
}

// ════════════════════════════════════════════════════════════════════
// TIMERS
// ════════════════════════════════════════════════════════════════════
function startWorkoutTimer(){
  if(S.workoutTimer)clearInterval(S.workoutTimer);
  S.workoutTimer=setInterval(()=>{
    S.workoutElapsed++;
    const el=document.getElementById('wt');
    if(el)el.textContent=fmt(S.workoutElapsed);
  },1000);
}
function stopWorkoutTimer(){if(S.workoutTimer){clearInterval(S.workoutTimer);S.workoutTimer=null;}}
function startRest(sec){
  if(S.restTimer)clearInterval(S.restTimer);
  S.restActive=true; S.restRemaining=sec;
  renderRestBanner();
  S.restTimer=setInterval(()=>{
    S.restRemaining--;
    const el=document.getElementById('rest-time');
    if(el)el.textContent=fmt(S.restRemaining);
    if(S.restRemaining<=0){
      clearInterval(S.restTimer); S.restActive=false;
      document.getElementById('rest-banner')?.remove();
      toast('⏱ ¡Descanso terminado!');
    }
  },1000);
}
function adjustRest(d){
  S.restRemaining=Math.max(5,S.restRemaining+d);
  const el=document.getElementById('rest-time');
  if(el)el.textContent=fmt(S.restRemaining);
}
function skipRest(){
  if(S.restTimer){clearInterval(S.restTimer);S.restTimer=null;}
  S.restActive=false;
  document.getElementById('rest-banner')?.remove();
}
function renderRestBanner(){
  let rb=document.getElementById('rest-banner');
  if(!rb){rb=mk('div','rest-banner');rb.id='rest-banner';document.querySelector('.workout-header')?.after(rb);}
  rb.innerHTML=`<div class="rest-left"><div class="rest-lbl">Descanso</div><div class="rest-time" id="rest-time">${fmt(S.restRemaining)}</div></div>
  <div class="rest-right">
    <div class="rest-adj">
      <button class="radj" onclick="adjustRest(-15)">−15s</button>
      <button class="radj" onclick="adjustRest(15)">+15s</button>
      <button class="radj" onclick="adjustRest(30)">+30s</button>
    </div>
    <button class="rest-skip" onclick="skipRest()">Saltar →</button>
  </div>`;
}

// ════════════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════════════
function render(){
  Object.values(S.chartInstances).forEach(c=>{try{c.destroy();}catch{}});
  S.chartInstances={};
  const app=document.getElementById('app');
  app.innerHTML='';
  if(S.page==='gym') renderGym(app);
  else if(S.page==='history') renderHistory(app);
  else if(S.page==='progress') renderProgress(app);
  else if(S.page==='export') renderExport(app);
  ['gym','history','progress','export'].forEach(p=>{
    document.getElementById('nav-'+p)?.classList.toggle('active',S.page===p);
  });
  if(S.sessionActive) startWorkoutTimer();
}

// ════════════════════════════════════════════════════════════════════
// GYM PAGE
// ════════════════════════════════════════════════════════════════════
function renderGym(app){
  const day=ROUTINE[S.dayIdx];
  const{done,total}=countDone();

  app.appendChild(mk('div','page-header',`<div class="app-title">Gym<em>Log</em></div><div class="page-sub">${new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</div>`));

  // Day tabs
  const tabs=mk('div','day-tabs');
  ROUTINE.forEach((d,i)=>{
    const b=mk('button','day-tab'+(i===S.dayIdx?' active':''),d.name);
    b.onclick=()=>{
      if(S.sessionActive){if(!confirm('¿Cambiar de día? El entreno activo se descartará.'))return;discardSession(false);}
      S.dayIdx=i; S.sessionSets={}; S.openEx={}; render();
    };
    tabs.appendChild(b);
  });
  app.appendChild(tabs);

  // Workout header
  const wh=mk('div','workout-header');
  wh.innerHTML=`
    <div class="workout-day-name">
      <span class="workout-day-dot ${S.sessionActive?'':''}"></span>
      ${day.name}
    </div>
    <div class="workout-day-sub">${day.sub}</div>
    <div class="workout-stats">
      <div>
        <div class="stat-val ${S.sessionActive?'timer-live':''}" id="wt">${fmt(S.workoutElapsed)}</div>
        <div class="stat-label">Duración</div>
      </div>
      <div>
        <div class="stat-val">${done}/${total}</div>
        <div class="stat-label">Series</div>
      </div>
      <div>
        <div class="stat-val">${day.exercises.length}</div>
        <div class="stat-label">Ejercicios</div>
      </div>
    </div>`;
  // set dot color
  wh.querySelector('.workout-day-dot').style.cssText=`width:7px;height:7px;border-radius:50%;background:${day.color};display:inline-block;${S.sessionActive?'box-shadow:0 0 6px '+day.color:''}`;
  app.appendChild(wh);

  // Rest banner
  if(S.restActive) renderRestBanner();

  // Exercises
  day.exercises.forEach(ex=>{
    initSets(ex.id,ex.sets);
    app.appendChild(buildExCard(ex));
  });

  // ── ACTION BAR (bottom) ──
  const bar=mk('div','action-bar');
  if(!S.sessionActive){
    const sb=mk('button','btn btn-primary');
    sb.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg> Iniciar entrenamiento`;
    sb.onclick=()=>{
      S.sessionActive=true; S.sessionStart=Date.now();
      S.workoutElapsed=0; S.sessionSets={};
      day.exercises.forEach(ex=>{initSets(ex.id,ex.sets); S.openEx[ex.id]=true;});
      saveSesh(); render();
    };
    bar.appendChild(sb);
  }else{
    const fb=mk('button','btn btn-success');
    fb.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Finalizar entrenamiento`;
    fb.onclick=()=>finishSession();
    bar.appendChild(fb);
    const db=mk('button','btn btn-danger');

function discardSession(doRender=true){
  stopWorkoutTimer(); skipRest();
  S.sessionActive=false; S.sessionStart=null; S.sessionSets={}; S.workoutElapsed=0;
  localStorage.removeItem('gl3_activeSession');
  if(doRender)render();

function buildExCard(ex){
  const isOpen=S.openEx[ex.id]!==false;
  const sets=S.sessionSets[ex.id]||[];
  const doneSets=sets.filter(s=>s.done).length;
  const pct=sets.length?doneSets/sets.length*100:0;

  const card=mk('div','ex-card');
  const pb=mk('div','ex-progress-bar',`<div class="ex-progress-fill" style="width:${pct}%"></div>`);
  card.appendChild(pb);

  const hdr=mk('div','ex-header');
  hdr.innerHTML=`<div class="ex-left-bar" style="background:${exColor(ex)}"></div>
    <div class="ex-info">
      <div class="ex-name">${ex.name}</div>
      <div class="ex-meta">${ex.sets} series · ${ex.repsTarget} reps · desc ${fmt(ex.rest)}</div>
    </div>
    <div class="ex-actions">
      <button class="ex-swap-btn" title="Cambiar ejercicio" onclick="event.stopPropagation();openSwapModal(${S.dayIdx},'${ex.id}')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
      </button>
      <span class="ex-chevron ${isOpen?'open':''}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </span>
    </div>`;
  hdr.onclick=()=>{S.openEx[ex.id]=!isOpen; render();};
  card.appendChild(hdr);

  if(isOpen){
    const sa=mk('div','sets-area');
    const prev=getPrev(ex.id);
    if(prev) sa.appendChild(mk('div','prev-tag',prev));

    sa.appendChild(mk('div','sets-header','<span>Ser</span><span>Peso kg</span><span>Reps</span><span>Anterior</span><span></span>'));

    sets.forEach((s,idx)=>sa.appendChild(buildSetRow(ex,idx,s,sets)));

    if(S.sessionActive){
      const ab=mk('button','add-set-row');
      ab.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Añadir serie`;
      ab.onclick=()=>{S.sessionSets[ex.id].push({weight:'',reps:'',done:false});saveSesh();render();};
      sa.appendChild(ab);
    }
    card.appendChild(sa);
    card.appendChild(mk('div','ex-note',ex.note));
  }
  return card;
}

function buildSetRow(ex,idx,s,allSets){
  const row=mk('div','set-row');
  row.appendChild(mk('div','set-num',String(idx+1)));

  const wi=document.createElement('input');
  wi.className='set-input'+(s.weight?' filled':'');
  wi.type='number'; wi.inputMode='decimal'; wi.placeholder='0'; wi.value=s.weight;
  wi.disabled=!S.sessionActive;
  wi.oninput=e=>{S.sessionSets[ex.id][idx].weight=e.target.value;saveSesh();};

  const ri=document.createElement('input');
  ri.className='set-input'+(s.reps?' filled':'');
  ri.type='number'; ri.inputMode='numeric'; ri.placeholder='0'; ri.value=s.reps;
  ri.disabled=!S.sessionActive;
  ri.oninput=e=>{S.sessionSets[ex.id][idx].reps=e.target.value;saveSesh();};

  row.appendChild(wi); row.appendChild(ri);
  row.appendChild(mk('div','set-prev',getPrevSet(ex.id,idx)));

  const cell=mk('div','');
  cell.style.cssText='display:flex;flex-direction:column;gap:3px;align-items:center';

  const db=mk('button','set-done-btn'+(s.done?' done':''),s.done?'✓':'○');
  db.disabled=!S.sessionActive;
  db.onclick=()=>{
    if(!S.sessionActive)return;
    const cur=S.sessionSets[ex.id][idx];
    cur.done=!cur.done;
    if(cur.done){
      if(!cur.weight&&!cur.reps){
        const h=gs('history')||[];
        for(let i=h.length-1;i>=0;i--){
          if(h[i].sets&&h[i].sets[ex.id]&&h[i].sets[ex.id][idx]){
            const ps=h[i].sets[ex.id][idx];
            if(ps.weight)cur.weight=ps.weight;
            if(ps.reps)cur.reps=ps.reps;
            break;
          }
        }
      }
      startRest(ex.rest);
      toast(`Serie ${idx+1} completada · desc ${fmt(ex.rest)}`);
    }else{skipRest();}
    saveSesh();render();
  };
  cell.appendChild(db);

  if(S.sessionActive&&allSets.length>1){
    const del=mk('button','set-del-btn','×');
    del.onclick=()=>{S.sessionSets[ex.id].splice(idx,1);saveSesh();render();};
    cell.appendChild(del);
  }
  row.appendChild(cell);
  return row;
}

// ── SWAP EXERCISE MODAL ──
function openSwapModal(dayIdx, exId){
  const day=ROUTINE[dayIdx];
  const ex=day.exercises.find(e=>e.id===exId);
  if(!ex){return;}
  const libKey=ex.libKey;
  const alternatives=(LIBRARY[libKey]||[]).filter(a=>a.id!==exId);

  let html=`<div class="modal-hdr">Cambiar ejercicio<button class="modal-close" onclick="closeModal()">✕</button></div>`;
  html+=`<div class="lib-section-title">Actual</div>
    <div class="lib-ex-item" style="background:var(--bg3);border-color:var(--border)">
      <div><div class="lib-ex-name">${ex.name}</div><div class="lib-ex-tags"><span class="lib-tag primary">${ex.type}</span><span class="lib-current-badge">En uso</span></div></div>
    </div>`;

  if(alternatives.length){
    html+=`<div class="lib-section-title">Alternativas</div>`;
    alternatives.forEach(alt=>{
      html+=`<div class="lib-ex-item" onclick="swapExercise(${dayIdx},'${exId}','${alt.id}')">
        <div>
          <div class="lib-ex-name">${alt.name}</div>
          <div class="lib-ex-tags"><span class="lib-tag primary">${alt.muscle}</span><span class="lib-tag">${alt.type}</span></div>
          <div style="font-size:11px;color:var(--text3);margin-top:4px">${alt.note}</div>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polyline points="9 18 15 12 9 6"/></svg>
      </div>`;
    });
  }else{
    html+=`<div style="font-size:12px;color:var(--text3);padding:16px 0;text-align:center">No hay alternativas registradas para este ejercicio.</div>`;
  }
  openModal(html);
}

function swapExercise(dayIdx, oldExId, newLibId){
  // Find the alt in the library
  let alt=null;
  for(const alts of Object.values(LIBRARY)){const f=alts.find(a=>a.id===newLibId);if(f){alt=f;break;}}
  if(!alt)return;

  const day=ROUTINE[dayIdx];
  const exIdx=day.exercises.findIndex(e=>e.id===oldExId);
  if(exIdx===-1)return;

  const old=day.exercises[exIdx];
  day.exercises[exIdx]={
    ...old,
    name:alt.name,
    note:alt.note,
    type:alt.type,
  };
  saveRoutine(ROUTINE);
  closeModal();
  toast(`✓ ${alt.name}`);
  render();
}

// ── FINISH SESSION ──
function finishSession(){
  const day=ROUTINE[S.dayIdx];
  let vol=0; const exSum=[];
  day.exercises.forEach(ex=>{
    const sets=(S.sessionSets[ex.id]||[]).filter(s=>s.done);
    if(sets.length){
      vol+=sets.reduce((a,s)=>a+(parseFloat(s.weight)||0)*(parseInt(s.reps)||0),0);
      exSum.push({name:ex.name,done:sets.length,maxW:Math.max(...sets.map(s=>parseFloat(s.weight)||0))});
    }
  });
  const{done,total}=countDone();

  openModal(`<div class="modal-hdr">Resumen<button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="fin-row"><span class="fin-lbl">Día</span><span class="fin-val">${day.name}</span></div>
    <div class="fin-row"><span class="fin-lbl">Duración</span><span class="fin-val">${fmt(S.workoutElapsed)}</span></div>
    <div class="fin-row"><span class="fin-lbl">Series</span><span class="fin-val">${done}/${total}</span></div>
    <div class="fin-row"><span class="fin-lbl">Volumen</span><span class="fin-val">${vol.toFixed(0)} kg</span></div>
    ${exSum.map(e=>`<div class="fin-row"><span class="fin-lbl" style="font-size:11px">${e.name}</span><span class="fin-val" style="font-size:11px">${e.done} ser · ${e.maxW}kg</span></div>`).join('')}
    <button class="btn btn-success" style="margin-top:14px" onclick="saveSession(${S.workoutElapsed},${vol.toFixed(0)})">Guardar entrenamiento</button>
    <button class="btn btn-ghost" onclick="closeModal()" style="margin-top:0">Seguir entrenando</button>`);
}

function saveSession(duration,volume){
  const day=ROUTINE[S.dayIdx];
  const history=gs('history')||[];
  history.push({id:Date.now(),dayId:day.id,dayName:day.name,date:Date.now(),duration,volume,sets:JSON.parse(JSON.stringify(S.sessionSets))});
  gw('history',history);
  discardSession(false);
  closeModal(); toast('✅ Entrenamiento guardado');
  setTimeout(()=>{S.page='history';render();},400);
}

function renderStrengthTab(app){
  const history=gs('history')||[];
  if(!history.length){

    return;
  }
  const compounds=[];
  ROUTINE.forEach(day=>day.exercises.forEach(ex=>{if(ex.type==='compound'&&!compounds.find(c=>c.id===ex.id))compounds.push(ex);}));
  const withData=compounds.filter(ex=>history.some(h=>h.sets&&h.sets[ex.id]&&h.sets[ex.id].some(s=>s.done&&s.weight))).slice(0,6);

  if(!withData.length){app.appendChild(mk('div','hist-empty','Apunta pesos en tus series para ver la progresión.'));return;}
  const colors=['#7c6cff','#3ecf8e','#f5a623','#ff5f5f','#ff6eb4','#00c8ff'];

  withData.forEach((ex,ci)=>{
    const pts=history.filter(h=>h.sets&&h.sets[ex.id]).map(h=>{
      const s=(h.sets[ex.id]||[]).filter(s=>s.done&&s.weight);
      const mx=s.length?Math.max(...s.map(s=>parseFloat(s.weight)||0)):null;
      return mx?{date:h.date,val:mx}:null;
    }).filter(Boolean);
    if(!pts.length)return;
    const mx=Math.max(...pts.map(p=>p.val));
    const sec=mk('div','chart-card');
    sec.innerHTML=`<div class="chart-card-title">${ex.name} <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--accent)">max ${mx}kg</span></div><div class="chart-wrap"><canvas id="sc-${ex.id}"></canvas></div>`;
    app.appendChild(sec);
    mkChart('sc-'+ex.id,colors[ci%colors.length],pts,p=>fmtDs(p.date),p=>p.val);
  });
}

// ════════════════════════════════════════════════════════════════════
// EXPORT PAGE
// ════════════════════════════════════════════════════════════════════
function renderExport(app){
  app.appendChild(mk('div','page-header',`<div class="app-title">Gym<em>Log</em></div><div class="page-sub">Exportar</div>`));

  const history=gs('history')||[];
  const sg=mk('div','stats-grid');
  sg.innerHTML=`
    <div class="stat-card"><div class="stat-card-val">${history.length}</div><div class="stat-card-lbl">Sesiones</div></div>
    <div class="stat-card"><div class="stat-card-val">${Math.round(history.reduce((a,h)=>a+(h.duration||0),0)/60)}'</div><div class="stat-card-lbl">Minutos totales</div></div>
    <div class="stat-card"><div class="stat-card-val">${(history.reduce((a,h)=>a+(parseFloat(h.volume)||0),0)/1000).toFixed(1)}t</div><div class="stat-card-lbl">Volumen total</div></div>
    <div class="stat-card"><div class="stat-card-val">${(gs('bodyWeight')||[]).length}</div><div class="stat-card-lbl">Pesajes</div></div>`;
  app.appendChild(sg);

  const rows=[
    {title:'Historial entrenos',btns:[{lbl:'CSV',cls:'g',fn:'exportCSV()'},{lbl:'JSON',cls:'p',fn:'exportJSON()'}]},
    {title:'Backup completo (entrenos + cuerpo)',btns:[{lbl:'Backup',cls:'p',fn:'exportFull()'},{lbl:'Importar',cls:'',fn:'importJSON()'}]},
    {title:'Rutina actual',btns:[{lbl:'Exportar rutina',cls:'p',fn:'exportRoutine()'},{lbl:'Restaurar default',cls:'r',fn:'resetRoutine()'}]},
    {title:'Peligroso',btns:[{lbl:'Borrar todos los datos',cls:'r',fn:'clearAll()'}]},
  ];
  rows.forEach(row=>{
    const sec=mk('div','');
    sec.innerHTML=`<div class="exp-section-title">${row.title}</div><div class="exp-row">${row.btns.map(b=>`<button class="exp-btn ${b.cls}" onclick="${b.fn}">${b.lbl}</button>`).join('')}</div>`;
    app.appendChild(sec);
  });

  const info=mk('div','info-box');
  info.innerHTML=`<strong style="color:var(--text2)">Sobre los datos:</strong> Todo se guarda automáticamente en tu navegador. Haz <strong style="color:var(--text2)">Backup completo</strong> regularmente para no perder nada. Para abrir en otro dispositivo, importa el JSON desde el nuevo navegador. El CSV se abre en Excel o Google Sheets.<br><br><strong style="color:var(--text2)">Cambiar la rutina en el futuro:</strong> Usa "Exportar rutina" para guardar la configuración actual, modifica los ejercicios desde la app, y usa "Importar" para restaurar si algo sale mal. El historial se mantiene independientemente de los cambios en la rutina.`;
  app.appendChild(info);
}

function dl(filename,content,type){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function exportCSV(){
  const h=gs('history')||[];if(!h.length){toast('Sin datos');return;}
  let csv='Fecha,Día,Duración(min),Volumen(kg),Ejercicio,Serie,Peso(kg),Reps,Completada\n';
  h.forEach(s=>{
    const day=ROUTINE.find(d=>d.id===s.dayId);
    const date=new Date(s.date).toLocaleDateString('es-ES');
    if(day&&s.sets)day.exercises.forEach(ex=>(s.sets[ex.id]||[]).forEach((r,i)=>{
      csv+=`"${date}","${s.dayName}",${Math.round(s.duration/60)},${s.volume},"${ex.name}",${i+1},${r.weight||0},${r.reps||0},${r.done?'Sí':'No'}\n`;
    }));
  });
  dl('gymlog_historial.csv',csv,'text/csv;charset=utf-8;'); toast('✅ CSV exportado');
}
function exportJSON(){
  const h=gs('history')||[];if(!h.length){toast('Sin datos');return;}
  dl('gymlog_historial.json',JSON.stringify({version:3,date:new Date().toISOString(),history:h},null,2),'application/json'); toast('✅ JSON exportado');
}
function exportFull(){
  dl('gymlog_backup.json',JSON.stringify({version:3,date:new Date().toISOString(),history:gs('history')||[],bodyWeight:gs('bodyWeight')||[],bodyMeasures:gs('bodyMeasures')||[],routine:ROUTINE},null,2),'application/json'); toast('✅ Backup exportado');
}
function exportRoutine(){
  dl('gymlog_rutina.json',JSON.stringify({version:3,date:new Date().toISOString(),routine:ROUTINE},null,2),'application/json'); toast('✅ Rutina exportada');
}
function resetRoutine(){
  if(!confirm('¿Restaurar la rutina por defecto? Los cambios de ejercicios se perderán (el historial NO).'))return;
  ROUTINE=JSON.parse(JSON.stringify(DEFAULT_ROUTINE)); saveRoutine(ROUTINE); toast('Rutina restaurada'); render();
}
function importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.history){const cur=gs('history')||[];gw('history',[...cur,...data.history.filter(h=>!cur.find(c=>c.id===h.id))]);}
        if(data.bodyWeight){const cur=gs('bodyWeight')||[];gw('bodyWeight',[...cur,...data.bodyWeight.filter(r=>!cur.find(c=>c.id===r.id))]);}
        if(data.bodyMeasures){const cur=gs('bodyMeasures')||[];gw('bodyMeasures',[...cur,...data.bodyMeasures.filter(r=>!cur.find(c=>c.id===r.id))]);}
        if(data.routine){ROUTINE=data.routine;saveRoutine(ROUTINE);}
        toast('✅ Datos importados'); render();
      }catch{toast('❌ Error al importar');}
    };
    reader.readAsText(file);
  };
  inp.click();
}
function clearAll(){
  if(!confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer.'))return;
  ['history','activeSession','bodyWeight','bodyMeasures','bodyPhotos','routine'].forEach(k=>localStorage.removeItem('gl3_'+k));
  ROUTINE=JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
  discardSession(false); toast('Datos eliminados'); render();
}

// ════════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════════
render();
if(S.sessionActive) startWorkoutTimer();

if('serviceWorker' in navigator){
  const sw=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>new Response('')))));`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
}
</script>
