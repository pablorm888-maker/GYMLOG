  if(found.idx<0){toast('Sesión no encontrada');return;}
  const original=found.history[found.idx];
  const copy=safeCloneHistory(original);
  copy.id=Date.now();
  copy.date=Date.now();
  copy.notes=(copy.notes?copy.notes+'\\n':'')+'Duplicada desde sesión del '+fmtD(original.date);
  found.history.push(copy);
  gw('history',found.history);
  toast('Sesión duplicada');
  render();
}
function setsForRepeatFromHistory(h){
  const out={};
  Object.keys(h.sets||{}).forEach(exId=>{
    const arr=(h.sets[exId]||[]).filter(s=>s&&s.done).map(s=>({
      weight:String(s.weight??''),
      reps:String(s.reps??''),
      done:false
    }));
    if(arr.length)out[exId]=arr;
  });
  return out;
}
function repeatHistorySession(id){
  const found=historySessionById(id);
  if(found.idx<0){toast('Sesión no encontrada');return;}
  const h=found.history[found.idx];

  if(S.sessionActive&&!confirm('Ya hay un entrenamiento activo. ¿Sustituirlo por esta sesión del historial?'))return;

  const dayIdx=ROUTINE.findIndex(d=>String(d.id)===String(h.dayId));
  if(dayIdx<0){
    toast('No se encontró el día de rutina de esta sesión');
    return;
  }

  const repeatedSets=setsForRepeatFromHistory(h);
  if(!Object.keys(repeatedSets).length){
    toast('Esta sesión no tiene series completadas para repetir');
    return;
  }

  stopWorkoutTimer();
  skipRest();

  S.dayIdx=dayIdx;
  S.sessionActive=true;
  S.sessionStart=Date.now();
  S.sessionSets=repeatedSets;
  S.sessionHiddenEx=[];
  S.sessionPrAlerts={};
  S.workoutElapsed=0;
  S.restEndAt=null;
  S.restActive=false;
  S.restRemaining=0;
  S.page='gym';

  visibleExercises(ROUTINE[S.dayIdx]).forEach(ex=>{
    if(!S.sessionSets[ex.id])initSets(ex.id,ex.sets);
  });

  saveSesh();
  closeModal();
  toast('Sesión cargada como nuevo entrenamiento');
  render();
}
function sessionCompareStats(h){
  const sets=h?.sets||{};
  const done=historySessionDoneCount(sets);
  const volume=historySessionVolume(sets);
  const exs=historyExerciseEntries(h).filter(ex=>(sets[ex.id]||[]).some(s=>s.done));
  let maxWeight=0,totalReps=0;
  Object.values(sets).forEach(arr=>(arr||[]).forEach(s=>{
    if(s&&s.done){
      maxWeight=Math.max(maxWeight,parseFloat(s.weight)||0);
      totalReps+=parseInt(s.reps)||0;
    }
  }));
  return {done,volume,exs,maxWeight,totalReps};
}

function compareDelta(a,b,unit=''){
  const d=(b||0)-(a||0);
  const cls=d>0?'color:#3ecf8e':d<0?'color:#ff7f7f':'color:#9fa8ba';
  return `<span style="${cls}">${d>0?'+':''}${Math.round(d)}${unit}</span>`;
}
function openSessionComparison(idA,idB){
  const fa=historySessionById(idA),fb=historySessionById(idB);
  if(fa.idx<0||fb.idx<0){toast('Sesión no encontrada');return;}
  const A=fa.history[fa.idx],B=fb.history[fb.idx],sa=sessionCompareStats(A),sb=sessionCompareStats(B);
  let html=`<div class="modal-hdr">Comparativa<button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="hist-compare-grid">
      ${sessionCompareCard(A,sa,'Sesión A')}

    </div>
    <div class="lib-section-title">Diferencia B vs A</div>
    <div class="hist-compare-card">
      <div class="hist-compare-stat"><span>Volumen</span><strong>${compareDelta(sa.volume,sb.volume,' kg')}</strong></div>
      <div class="hist-compare-stat"><span>Series completadas</span><strong>${compareDelta(sa.done,sb.done)}</strong></div>
      <div class="hist-compare-stat"><span>Reps totales</span><strong>${compareDelta(sa.totalReps,sb.totalReps)}</strong></div>
      <div class="hist-compare-stat"><span>Peso máximo</span><strong>${compareDelta(sa.maxWeight,sb.maxWeight,' kg')}</strong></div>
    </div>
    <div class="exercise-profile-actions">
      <button class="btn btn-ghost" onclick="openCompareSessionsPicker(${A.id})">Cambiar sesiones</button>
      <button class="btn btn-primary" onclick="closeModal()">Cerrar</button>

}

const BODY_METRICS = [
  {id:'weight',label:'Peso',unit:'kg',color:'#7c6cff'},
  {id:'waist',label:'Cintura',unit:'cm',color:'#3ecf8e'},
  {id:'hip',label:'Cadera',unit:'cm',color:'#f5a623'},

  {id:'abdomen',label:'Abdomen',unit:'cm',color:'#8bd450'},
  {id:'neck',label:'Cuello',unit:'cm',color:'#b78cff'},
  {id:'armLeft',label:'Brazo izq.',unit:'cm',color:'#ff6eb4'},
  {id:'armRight',label:'Brazo der.',unit:'cm',color:'#ff8bc6'},
  {id:'thighLeft',label:'Muslo izq.',unit:'cm',color:'#00c8ff'},
  {id:'thighRight',label:'Muslo der.',unit:'cm',color:'#4fd9ff'},
  {id:'calfLeft',label:'Pantorrilla izq.',unit:'cm',color:'#ffcf5a'},
  {id:'calfRight',label:'Pantorrilla der.',unit:'cm',color:'#ffe08a'},
];
const BODY_LEGACY_METRICS = {armLeft:['arm'],armRight:['arm'],thighLeft:['thigh'],thighRight:['thigh'],calfLeft:['calf'],calfRight:['calf']};

function bodyMetricDef(id){return BODY_METRICS.find(m=>m.id===id)||BODY_METRICS[0];}
function bodyNum(v){const n=parseFloat(v);return isNaN(n)?null:n;}
function bodyMetricValue(r,metric){
  if(!r)return null;
  const direct=bodyNum(r[metric]);
  if(direct!==null)return direct;
  const legacy=BODY_LEGACY_METRICS[metric]||[];
  for(const key of legacy){const v=bodyNum(r[key]);if(v!==null)return v;}
  return null;
}
function bodyDateValue(v){return v?new Date(v).getTime():null;}
function ensureProgressState(){
  if(!['checkin','charts','photos','strength','weight','measures'].includes(S.progressTab))S.progressTab='checkin';
  if(S.progressTab==='weight'||S.progressTab==='measures')S.progressTab='charts';
  if(!S.bodyMetric)S.bodyMetric='all';
  if(!('bodyFrom' in S))S.bodyFrom='';
  if(!('bodyTo' in S))S.bodyTo='';
  if(!S.strengthMuscle)S.strengthMuscle='all';
  if(!('strengthFrom' in S))S.strengthFrom='';
  if(!('strengthTo' in S))S.strengthTo='';
}
function getBodyCheckins(){return gs('bodyCheckins')||[];}
function saveBodyCheckins(v){v.sort((a,b)=>(a.date||0)-(b.date||0));gw('bodyCheckins',v);}
function metricRecords(metric){
  const out=[];
  getBodyCheckins().forEach(r=>{const v=bodyMetricValue(r,metric);if(v!==null)out.push({date:r.date,val:v,source:'checkin'});});
  if(metric==='weight'){
    (gs('bodyWeight')||[]).forEach(r=>{const v=bodyNum(r.weight);if(v!==null)out.push({date:r.date,val:v,source:'legacy'});});
  }else{
    (gs('bodyMeasures')||[]).forEach(r=>{const v=bodyMetricValue(r,metric);if(v!==null)out.push({date:r.date,val:v,source:'legacy'});});
  }
  const seen=new Set();
  return out.filter(r=>{
    const k=metric+'_'+r.date+'_'+r.val;
    if(seen.has(k))return false; seen.add(k); return true;
  }).sort((a,b)=>a.date-b.date);
}
function metricRecordsFiltered(metric){
  const from=bodyDateValue(S.bodyFrom),to=bodyDateValue(S.bodyTo);
  const toEnd=to?to+86399999:null;
  return metricRecords(metric).filter(r=>(!from||r.date>=from)&&(!toEnd||r.date<=toEnd));
}
function latestMetric(metric){const r=metricRecords(metric);return r.length?r[r.length-1]:null;}
function deltaMetric(metric){const r=metricRecordsFiltered(metric);return r.length>1?r[r.length-1].val-r[0].val:null;}
function metricDeltaHtml(metric){
  const d=deltaMetric(metric); if(d===null)return '<div class="metric-card-delta">Sin comparativa</div>';
  const def=bodyMetricDef(metric); const cls=d<0?' down':''; const sign=d>0?'+':'';
  return `<div class="metric-card-delta${cls}">${sign}${d.toFixed(1)} ${def.unit} periodo</div>`;
}
function allBodyPhotos(){
  const out=[];
  (gs('bodyPhotos')||[]).forEach(p=>out.push({id:p.id,src:p.src,date:p.date,label:'Foto'}));
  getBodyCheckins().forEach(c=>{
    if(c.photos){
      ['front','side','back'].forEach(k=>{if(c.photos[k])out.push({id:c.id+'_'+k,src:c.photos[k],date:c.date,label:k==='front'?'Frontal':k==='side'?'Lateral':'Espalda',checkinId:c.id,slot:k});});
    }
  });
  return out.sort((a,b)=>(b.date||0)-(a.date||0));
}

}

function compressImageFile(file,max=1000,quality=.78){
  return new Promise((resolve,reject)=>{
    if(!file){resolve(null);return;}
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
async function saveBodyCheckin(){
  const d=document.getElementById('ci-date').value;
  if(!d){toast('Selecciona fecha');return;}
  const r={id:Date.now(),date:new Date(d).getTime(),weight:bodyNum(document.getElementById('ci-weight').value),waist:bodyNum(document.getElementById('ci-waist').value),hip:bodyNum(document.getElementById('ci-hip').value),chest:bodyNum(document.getElementById('ci-chest').value),abdomen:bodyNum(document.getElementById('ci-abdomen').value),neck:bodyNum(document.getElementById('ci-neck').value),armLeft:bodyNum(document.getElementById('ci-arm-left').value),armRight:bodyNum(document.getElementById('ci-arm-right').value),thighLeft:bodyNum(document.getElementById('ci-thigh-left').value),thighRight:bodyNum(document.getElementById('ci-thigh-right').value),calfLeft:bodyNum(document.getElementById('ci-calf-left').value),calfRight:bodyNum(document.getElementById('ci-calf-right').value),note:document.getElementById('ci-note').value.trim(),photos:{}};
  const hasValue=BODY_METRICS.some(m=>bodyMetricValue(r,m.id)!==null)||r.note;
  try{
    const front=document.getElementById('ci-front').files[0],side=document.getElementById('ci-side').files[0],back=document.getElementById('ci-back').files[0];
    if(front)r.photos.front=await compressImageFile(front);
    if(side)r.photos.side=await compressImageFile(side);
    if(back)r.photos.back=await compressImageFile(back);
  }catch{toast('No se pudo procesar alguna foto');return;}
  if(!hasValue&&!Object.keys(r.photos).length){toast('Añade algún dato o foto');return;}
  const rec=getBodyCheckins();rec.push(r);saveBodyCheckins(rec);toast('✅ Check-in guardado');render();
}
function deleteBodyCheckin(id){

}

function allKnownExercises(){
  const map=new Map();
  getExerciseLibrary().forEach(e=>map.set(e.id,{id:e.id,exerciseId:e.id,name:e.name,muscleGroup:e.muscleGroup||'all',type:e.type||'isolation',primaryMuscle:e.primaryMuscle||''}));
  getRoutinePlans().forEach(p=>(p.days||[]).forEach(d=>(d.exercises||[]).forEach(e=>map.set(e.id,{id:e.id,exerciseId:e.exerciseId||e.id,name:e.name,muscleGroup:e.muscleGroup||'all',type:e.type||'isolation',primaryMuscle:e.primaryMuscle||''}))));
  ROUTINE.forEach(d=>(d.exercises||[]).forEach(e=>map.set(e.id,{id:e.id,exerciseId:e.exerciseId||e.id,name:e.name,muscleGroup:e.muscleGroup||'all',type:e.type||'isolation',primaryMuscle:e.primaryMuscle||''})));
  return [...map.values()];
}
function strengthPoints(exId){
  const history=gs('history')||[];
  return history.filter(h=>h.sets&&h.sets[exId]).map(h=>{
    const s=(h.sets[exId]||[]).filter(x=>x.done&&x.weight);
    const mx=s.length?Math.max(...s.map(x=>parseFloat(x.weight)||0)):null;
    return mx?{date:h.date,val:mx}:null;
  }).filter(Boolean).sort((a,b)=>a.date-b.date);
}
function strengthPointsFiltered(exId){
  const from=bodyDateValue(S.strengthFrom),to=bodyDateValue(S.strengthTo),toEnd=to?to+86399999:null;
  return strengthPoints(exId).filter(p=>(!from||p.date>=from)&&(!toEnd||p.date<=toEnd));
}

function dl(filename,content,type){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function exportCSV(){
  const h=gs('history')||[];if(!h.length){toast('Sin datos');return;}
  let csv='Fecha,Día,Duración(min),Volumen(kg),Ejercicio,Serie,Peso(kg),Reps,Completada\n';
  h.forEach(s=>{
    const day=ROUTINE.find(d=>d.id===s.dayId);
    const date=new Date(s.date).toLocaleDateString('es-ES');
    if(day&&s.sets)day.exercises.forEach(ex=>(s.sets[ex.id]||[]).forEach((r,i)=>{
      csv+=`"${date}","${s.dayName}",${Math.round(s.duration/60)},${s.volume},"${ex.name}",${i+1},${r.weight||0},${r.reps||0},${r.done?'Sí':'No'}\n`;
    }));
  });
  dl('gymlog_historial.csv',csv,'text/csv;charset=utf-8;'); toast('✅ CSV exportado');
}
function exportJSON(){
  const h=gs('history')||[];if(!h.length){toast('Sin datos');return;}
  dl('gymlog_historial.json',JSON.stringify({version:3,date:new Date().toISOString(),history:h},null,2),'application/json'); toast('✅ JSON exportado');
}
function exportFull(){

}
function exportRoutine(){
  dl('gymlog_rutina.json',JSON.stringify({version:4,date:new Date().toISOString(),routine:ROUTINE,routinePlans:getRoutinePlans(),activeRoutineId:getActiveRoutineId(),exerciseLibrary:getExerciseLibrary()},null,2),'application/json'); toast('✅ Rutina exportada');

function resetRoutine(){
  if(!confirm('¿Restaurar la rutina por defecto? Los cambios de ejercicios se perderán (el historial NO).'))return;
  const plans=[{id:'routine_default',name:'Rutina principal',createdAt:Date.now(),days:JSON.parse(JSON.stringify(DEFAULT_ROUTINE))}]; saveRoutinePlans(plans); gw('activeRoutineId','routine_default'); ROUTINE=getRoutine(); migrateRoutinePro(); saveRoutine(ROUTINE); toast('Rutina restaurada'); render();
}
function importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.history){const cur=gs('history')||[];gw('history',[...cur,...data.history.filter(h=>!cur.find(c=>c.id===h.id))]);}
        if(data.bodyWeight){const cur=gs('bodyWeight')||[];gw('bodyWeight',[...cur,...data.bodyWeight.filter(r=>!cur.find(c=>c.id===r.id))]);}
        if(data.bodyMeasures){const cur=gs('bodyMeasures')||[];gw('bodyMeasures',[...cur,...data.bodyMeasures.filter(r=>!cur.find(c=>c.id===r.id))]);}
        if(data.bodyPhotos){const cur=gs('bodyPhotos')||[];gw('bodyPhotos',[...cur,...data.bodyPhotos.filter(r=>!cur.find(c=>c.id===r.id))]);}
        if(data.bodyCheckins){const cur=gs('bodyCheckins')||[];gw('bodyCheckins',[...cur,...data.bodyCheckins.filter(r=>!cur.find(c=>c.id===r.id))]);}
        if(data.exerciseLibrary){saveExerciseLibrary(data.exerciseLibrary);}
        if(data.routinePlans){saveRoutinePlans(data.routinePlans); if(data.activeRoutineId)gw('activeRoutineId',data.activeRoutineId); ROUTINE=getRoutine(); migrateRoutinePro(); saveRoutine(ROUTINE);}
        else if(data.routine){ROUTINE=data.routine;migrateRoutinePro();saveRoutine(ROUTINE);}
        toast('✅ Datos importados'); render();
      }catch{toast('❌ Error al importar');}
    };
    reader.readAsText(file);
  };
  inp.click();
}
function clearAll(){
  if(!confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer.'))return;
  ['history','activeSession','bodyWeight','bodyMeasures','bodyPhotos','bodyCheckins','routine','routinePlans','activeRoutineId','exerciseLibrary'].forEach(k=>localStorage.removeItem('gl3_'+k));
  ROUTINE=getRoutine(); S.page='home';
  discardSession(false); toast('Datos eliminados'); render();
}
