<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="GymLog Pro">
<meta name="mobile-web-app-capable" content="yes">

<title>GymLog Pro</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0f;--bg2:#141416;--bg3:#1c1c20;--bg4:#242428;
  --border:#2a2a30;--border2:#363640;
  --text:#f0eff4;--text2:#9999aa;--text3:#55555f;
  --accent:#7c6cff;--accent-glow:rgba(124,108,255,0.15);
  --green:#3ecf8e;--green-dim:rgba(62,207,142,0.1);
  --amber:#f5a623;--amber-dim:rgba(245,166,35,0.1);
  --red:#ff5f5f;--red-dim:rgba(255,95,95,0.1);
  --radius:10px;--radius-lg:14px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden}
body{padding-bottom:70px}

/* ── NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,13,15,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:0;z-index:200;height:56px}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:none;font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.3px;color:var(--text3);cursor:pointer;padding:8px 0;transition:.2s;text-transform:uppercase}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{transition:.2s;opacity:.4}
.nav-btn.active svg{opacity:1}

/* ── LAYOUT ── */
.container{max-width:540px;margin:0 auto;padding:18px 14px 16px}
.page-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
.app-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--text);letter-spacing:-0.5px}
.app-title em{color:var(--accent);font-style:normal}
.page-sub{font-size:10px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}

/* ── BUTTONS ── */
.btn{width:100%;padding:14px;border-radius:var(--radius);border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.2px}
.btn:active{transform:scale(.97)}
.btn+.btn{margin-top:8px}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 20px var(--accent-glow)}
.btn-success{background:var(--green-dim);color:var(--green);border:1px solid rgba(62,207,142,.3)!important}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,95,95,.3)!important}
.btn-ghost{background:transparent;color:var(--text3);border:1px solid var(--border)!important}
.btn-sm{padding:8px 14px;font-size:12px;width:auto}
/* btn-sm helper */

/* ── DAY TABS ── */
.day-tabs{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{flex-shrink:0;padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:.15s;white-space:nowrap}
.day-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── WORKOUT HEADER ── */
.workout-header{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px}
.workout-day-name{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;margin-bottom:2px}
.workout-day-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.workout-day-sub{font-size:11px;color:var(--text3);margin-left:15px}
.workout-stats{display:flex;gap:20px;margin-top:12px}
.stat-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--text);line-height:1}
.stat-label{font-size:9px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.timer-live{color:var(--green)}

/* ── REST BANNER ── */
.rest-banner{background:var(--bg2);border:1px solid var(--amber);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rest-left{}
.rest-lbl{font-size:9px;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.rest-time{font-family:'DM Mono',monospace;font-size:30px;color:var(--amber);line-height:1}
.rest-right{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.rest-adj{display:flex;gap:4px}
.radj{padding:5px 8px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:11px;cursor:pointer;font-family:'DM Mono',monospace;transition:.1s}
.radj:active{border-color:var(--amber);color:var(--amber)}
.rest-skip{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:11px;cursor:pointer}

/* ── EXERCISE CARD ── */
.ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:8px;overflow:hidden}
.ex-progress-bar{height:2px;background:var(--border)}
.ex-progress-fill{height:100%;background:var(--green);transition:width .4s}
.ex-header{display:flex;align-items:center;gap:10px;padding:12px 13px;cursor:pointer;user-select:none}
.ex-left-bar{width:2px;height:28px;border-radius:2px;flex-shrink:0}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-meta{font-size:10px;color:var(--text3);margin-top:2px}
.ex-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ex-swap-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.ex-swap-btn:active{border-color:var(--accent);color:var(--accent)}
.ex-chevron{color:var(--text3);transition:transform .2s;font-size:14px}
.ex-chevron.open{transform:rotate(180deg)}

/* ── SETS TABLE ── */
.sets-area{padding:0 13px 12px}
.prev-tag{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);margin-bottom:8px;padding:3px 8px;background:var(--bg3);border-radius:5px;display:inline-block}
.sets-header{display:grid;grid-template-columns:22px 1fr 1fr 64px 26px;gap:5px;padding-bottom:5px;border-bottom:1px solid var(--border);margin-bottom:4px}
.sets-header span{font-size:9px;color:var(--text3);text-align:center;letter-spacing:.3px;font-weight:500;text-transform:uppercase}
.sets-header span:first-child{text-align:left}
.set-row{display:grid;grid-template-columns:34px 1fr 1fr 42px;gap:5px;align-items:center;padding:3px 0}
.set-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);text-align:center}
.set-input{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:7px 4px;font-family:'DM Mono',monospace;font-size:13px;color:var(--text);text-align:center;width:100%;outline:none;-moz-appearance:textfield;transition:.15s}
.set-input::-webkit-outer-spin-button,.set-input::-webkit-inner-spin-button{-webkit-appearance:none}
.set-input:focus{border-color:var(--accent);background:var(--bg4)}
.set-input:disabled{opacity:.35}
.set-prev{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);text-align:center}
.set-done-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;margin:auto}
.set-done-btn.done{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.set-del-btn{opacity:.3;cursor:pointer;background:none;border:none;color:var(--text2);font-size:14px;transition:.15s;margin:auto;display:flex;align-items:center;justify-content:center}
.set-del-btn:active{opacity:1;color:var(--red)}
.add-set-row{display:flex;align-items:center;gap:6px;padding:7px 0 2px;cursor:pointer;color:var(--text3);font-size:12px;background:none;border:none;font-family:'DM Sans',sans-serif;transition:.15s}
.add-set-row:active{color:var(--accent)}
.ex-note{padding:9px 13px;background:var(--bg3);border-top:1px solid var(--border);font-size:11px;color:var(--text3);line-height:1.5;border-left:2px solid var(--accent)}

/* ── SWAP MODAL LIBRARY ── */
.lib-search{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;margin-bottom:10px}
.lib-search:focus{border-color:var(--accent)}
.lib-ex-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:var(--radius);cursor:pointer;transition:.15s;border:1px solid transparent}
.lib-ex-item:hover,.lib-ex-item:active{background:var(--bg3);border-color:var(--border)}
.lib-ex-name{font-size:13px;color:var(--text);font-weight:500}
.lib-ex-tags{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.lib-tag{font-size:9px;padding:2px 6px;border-radius:20px;background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.lib-tag.primary{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.lib-section-title{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 5px;font-weight:500}
.lib-current-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--green-dim);color:var(--green);border:1px solid var(--green)}

/* ── HISTORY ── */
.hist-empty{text-align:center;padding:50px 20px;color:var(--text3);font-size:13px;line-height:1.6}
.hist-session{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:8px}
.hist-session-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.hist-day-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.hist-date{font-size:10px;color:var(--text3);margin-top:1px}
.hist-del-btn{padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:10px;cursor:pointer;transition:.15s}
.hist-del-btn:active{border-color:var(--red);color:var(--red)}
.hist-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.hist-pill{font-size:10px;padding:3px 8px;border-radius:20px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.hist-pill.a{background:var(--accent-glow);color:var(--accent);border-color:rgba(124,108,255,.3)}
.hist-ex-row{display:flex;justify-content:space-between;padding:3px 0;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border)}
.hist-ex-row:last-child{border-bottom:none}
.hist-ex-sets{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3)}

/* ── PROGRESS ── */
.seg{display:flex;background:var(--bg3);border-radius:var(--radius);padding:3px;gap:2px;margin-bottom:14px}
.seg-btn{flex:1;padding:7px 4px;border-radius:8px;border:none;background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg-btn.active{background:var(--bg2);color:var(--text);border:1px solid var(--border)}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px}
.chart-card-title{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.4px}
.chart-wrap{position:relative;height:150px}
.body-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.body-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.body-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:9px 10px;font-family:'DM Mono',monospace;font-size:14px;color:var(--text);outline:none;width:100%;transition:.15s}
.body-input:focus{border-color:var(--accent)}
.body-hist-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.body-hist-row:last-child{border-bottom:none}
.body-hist-date{color:var(--text3);font-size:10px}
.body-hist-val{font-family:'DM Mono',monospace;color:var(--text)}
.body-hist-del{background:none;border:none;color:var(--text3);font-size:14px;cursor:pointer;opacity:.3;transition:.15s;line-height:1}
.body-hist-del:active{opacity:1;color:var(--red)}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.filter-grid.three{grid-template-columns:1fr 1fr 1fr}
.metric-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.metric-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px}
.metric-card-val{font-family:'DM Mono',monospace;font-size:18px;color:var(--text);line-height:1.1}
.metric-card-lbl{font-size:9px;color:var(--text3);letter-spacing:.4px;text-transform:uppercase;margin-top:3px}
.metric-card-delta{font-family:'DM Mono',monospace;font-size:10px;color:var(--green);margin-top:4px}
.metric-card-delta.down{color:var(--red)}
.checkin-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:8px}
.checkin-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.checkin-date{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.checkin-note{font-size:11px;color:var(--text3);line-height:1.45;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.checkin-pills{display:flex;gap:5px;flex-wrap:wrap}
.checkin-pill{font-family:'DM Mono',monospace;font-size:10px;padding:3px 7px;border-radius:20px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.checkin-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.checkin-photo{aspect-ratio:1;border-radius:var(--radius);overflow:hidden;background:var(--bg3);border:1px solid var(--border);position:relative;cursor:pointer}
.checkin-photo img{width:100%;height:100%;object-fit:cover}
.checkin-photo span{position:absolute;left:0;right:0;bottom:0;padding:4px;font-size:9px;text-align:center;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
@media(max-width:420px){.filter-grid.three{grid-template-columns:1fr}.metric-row{grid-template-columns:1fr 1fr}}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo-thumb{aspect-ratio:1;border-radius:var(--radius);overflow:hidden;position:relative;background:var(--bg3);border:1px solid var(--border);cursor:pointer}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-date-lbl{position:absolute;bottom:0;left:0;right:0;padding:4px;font-size:9px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));text-align:center}
.photo-del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);border:none;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.photo-add-cell{aspect-ratio:1;border-radius:var(--radius);border:1px dashed var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;background:var(--bg3);transition:.15s}
.photo-add-cell:active{border-color:var(--accent)}
.photo-add-icon{font-size:20px;opacity:.5}
.photo-add-lbl{font-size:10px;color:var(--text3)}

/* ── EXPORT ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.stat-card-val{font-family:'DM Mono',monospace;font-size:20px;color:var(--text);margin-bottom:2px}
.stat-card-lbl{font-size:10px;color:var(--text3)}
.exp-section-title{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;margin-top:14px}
.exp-row{display:flex;gap:7px;margin-bottom:0}
.exp-btn{flex:1;padding:12px 8px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.exp-btn:active{transform:scale(.97)}
.exp-btn.g{border-color:rgba(62,207,142,.35);color:var(--green);background:var(--green-dim)}
.exp-btn.p{border-color:rgba(124,108,255,.35);color:var(--accent);background:var(--accent-glow)}
.exp-btn.r{border-color:rgba(255,95,95,.35);color:var(--red);background:var(--red-dim)}
.info-box{font-size:11px;color:var(--text3);line-height:1.6;padding:12px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);margin-top:12px}

/* ── TOAST / MODAL / VIEWER ── */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:9px 16px;border-radius:20px;font-size:12px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:20px;width:100%;max-width:540px;transform:translateY(100%);transition:transform .25s ease;max-height:88vh;overflow-y:auto}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-hdr{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;line-height:1;padding:0}
.fin-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.fin-row:last-of-type{border-bottom:none}
.fin-lbl{color:var(--text2)}
.fin-val{font-family:'DM Mono',monospace;color:var(--text)}
.photo-viewer{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:400;align-items:center;justify-content:center;display:none}
.photo-viewer.open{display:flex}
.photo-viewer img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:var(--radius)}
.pv-close{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}

/* ── SVG ICONS ── */
svg.icon{display:inline-block;vertical-align:middle;flex-shrink:0}

/* ── PRO LIBRARY / ROUTINE EDITOR ── */
.editor-actions{display:flex;gap:8px;margin:0 0 12px 0}
.editor-actions .btn{margin-top:0;flex:1}
.editor-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:10px}
.editor-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.editor-row:last-child{margin-bottom:0}
.editor-input,.editor-select{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none}
.editor-input:focus,.editor-select:focus{border-color:var(--accent)}
.editor-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.editor-ex{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:7px}
.editor-ex-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.editor-ex-name{font-size:13px;color:var(--text);font-weight:500;line-height:1.25}
.editor-ex-meta{font-size:10px;color:var(--text3);margin-top:3px}
.editor-mini-actions{display:flex;gap:5px;flex-shrink:0}
.editor-icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--bg4);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px}
.editor-icon-btn:active{border-color:var(--accent);color:var(--accent)}
.editor-icon-btn.danger:active{border-color:var(--red);color:var(--red)}
.lib-toolbar{display:grid;grid-template-columns:1fr 115px;gap:8px;margin-bottom:8px}
.lib-list{max-height:48vh;overflow:auto;padding-right:2px}
.lib-detail{border:1px solid var(--border);border-radius:var(--radius);background:var(--bg3);padding:12px;margin-bottom:10px}
.lib-gif-placeholder{height:130px;border:1px dashed var(--border2);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:12px;background:var(--bg4);margin-bottom:10px;text-align:center;padding:12px}
.exercise-gif{width:100%;max-height:230px;object-fit:contain;border-radius:var(--radius);background:var(--bg4);border:1px solid var(--border);margin-bottom:10px}
.gif-status{font-size:10px;color:var(--text3);margin-top:5px;font-family:'DM Mono',monospace;word-break:break-all}
.muscle-pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.muscle-pill{font-size:9px;padding:3px 7px;border-radius:20px;background:var(--bg4);color:var(--text2);border:1px solid var(--border)}


/* ════════════════════════════════════════════════════════════════════
   FASE 1.1 — VISUAL POLISH GLOBAL + ENTRENO
   Solo estética: contraste, jerarquía visual, legibilidad móvil.
   ════════════════════════════════════════════════════════════════════ */

:root{
  --bg:#08090d;
  --bg2:#11131a;
  --bg3:#181b24;
  --bg4:#202431;
  --border:#343948;
  --border2:#444b5d;
  --text:#f6f7fb;
  --text2:#c4c9d6;
  --text3:#858da0;
  --accent:#8577ff;
  --accent-glow:rgba(133,119,255,.18);
}

html,body{background:radial-gradient(circle at top,#11131a 0%,#08090d 42%,#07080b 100%);color:var(--text)}
.container{padding:20px 14px 18px}
.page-header{align-items:center;margin-bottom:18px}
.app-title{font-size:24px;letter-spacing:-.7px}
.page-sub{color:#9aa2b5;font-weight:700}

.bottom-nav{height:62px;background:rgba(8,9,13,.96);border-top:1px solid #2f3442;box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.nav-btn{font-size:9px;color:#7f879b;font-weight:700}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{opacity:.55}
.nav-btn.active svg{opacity:1;filter:drop-shadow(0 0 7px rgba(133,119,255,.38))}

.btn{border-radius:13px;font-weight:700;min-height:46px}
.btn-primary{background:linear-gradient(135deg,#8577ff,#6d5cff);box-shadow:0 8px 26px rgba(133,119,255,.20)}
.btn-success{background:rgba(62,207,142,.13);border-color:rgba(62,207,142,.42)!important}
.btn-danger{background:rgba(255,95,95,.13);border-color:rgba(255,95,95,.42)!important}
.btn-ghost{background:#12151d;color:#b9bfce;border-color:#363c4b!important}
.btn-sm{min-height:34px;border-radius:10px}

.day-tabs{gap:7px;margin-bottom:16px}
.day-tab{padding:8px 14px;border-color:#363c4b;background:#11141b;color:#a3aabc;font-weight:700}
.day-tab.active{background:linear-gradient(135deg,#8577ff,#6d5cff);border-color:#8577ff;color:#fff}

.workout-header{background:linear-gradient(180deg,#141720 0%,#10131a 100%);border-color:#353b4b;border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.workout-day-name{font-size:17px;color:#f8f9fd}
.workout-day-sub{color:#99a1b4}
.stat-val{font-size:22px;color:#fbfcff}
.stat-label{color:#8f98ac;font-weight:700}
.timer-live{color:#4be3a0;text-shadow:0 0 12px rgba(62,207,142,.25)}

.rest-banner{background:#141720;border-color:rgba(245,166,35,.55);box-shadow:0 8px 22px rgba(245,166,35,.08)}
.rest-time{font-size:32px}
.radj,.rest-skip{border-color:#3b4150;background:#171a23;color:#c0c6d5}

/* Entreno */
.ex-card{background:linear-gradient(180deg,#141720 0%,#10131a 100%)!important;border-color:#373d4d!important;border-radius:17px!important;margin-bottom:12px!important;box-shadow:0 10px 26px rgba(0,0,0,.22)}
.ex-header{padding:15px 14px 11px!important}
.ex-left-bar{width:3px!important;height:36px!important}
.ex-name{font-size:14px!important;font-weight:800!important;color:#fbfcff!important}
.ex-meta{font-size:11px!important;color:#a6aec1!important}
.ex-swap-btn{width:31px!important;height:31px!important;border-color:#41485a!important;background:#191d27!important;color:#b8c0d1!important}
.ex-chevron{color:#b8c0d1!important}
.sets-area{padding:0 14px 15px!important}
.sets-header{grid-template-columns:26px 1fr 1fr 70px 32px!important;gap:8px!important;border-bottom-color:#343a48!important}
.sets-header span{color:#9fa8bb!important;font-size:10px!important;font-weight:800!important}
.set-row{grid-template-columns:34px 1fr 1fr 42px;gap:8px!important;padding:5px 0!important}
.set-num{color:#c2c8d7!important;font-size:12px!important}
.set-input{background:#191d27!important;border-color:#3c4353!important;color:#f8f9fd!important;border-radius:10px!important;padding:10px 6px!important;font-size:15px!important}
.set-input:focus{background:#202431!important;border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(133,119,255,.14)!important}
.set-prev{color:#aeb6c8!important;font-size:11px!important}
.set-done-btn{width:32px!important;height:32px!important;border-radius:10px!important;border-color:#3c4353!important;background:#191d27!important;color:#c0c7d6!important}
.set-done-btn.done{background:rgba(62,207,142,.14)!important;border-color:#3ecf8e!important;color:#3ecf8e!important}
.add-set-row{color:#b8c0d1!important;font-weight:700!important}
.ex-note{background:#181c25!important;border-top-color:#343a48!important;color:#aeb6c8!important;font-size:11px!important}

/* Cards generales */
.chart-card,.editor-panel,.hist-session,.checkin-card,.stat-card{background:linear-gradient(180deg,#13161e 0%,#10131a 100%)!important;border-color:#353b4b!important;border-radius:16px!important;box-shadow:0 8px 22px rgba(0,0,0,.16)}
.chart-card-title{color:#d2d6e3!important;font-weight:800!important;letter-spacing:.55px!important}
.metric-card,.editor-ex,.lib-detail,.symmetry-card,.hist-detail-ex{background:#181c25!important;border-color:#353b4b!important}
.metric-card-val{color:#fbfcff!important}
.metric-card-lbl{color:#9aa2b5!important;font-weight:800!important}
.progress-note{color:#a5adbf!important}

/* Formularios */
.editor-input,.editor-select,.lib-search,.body-input{background:#181c25!important;border-color:#3a4152!important;color:#f7f8fc!important;border-radius:12px!important}
.editor-input:focus,.editor-select:focus,.lib-search:focus,.body-input:focus{border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(133,119,255,.14)!important}
.body-label,.editor-label{color:#c8cede!important;font-weight:800!important}
.body-section-title{color:#9d93ff!important}

/* Biblioteca / editor */
.editor-icon-btn{border-color:#41485a!important;background:#191d27!important;color:#c0c7d6!important}
.lib-ex-name,.editor-ex-name{color:#f5f6fb!important}
.lib-tag,.muscle-pill{background:#202431!important;border-color:#3b4252!important;color:#aeb6c8!important}
.lib-tag.primary{color:#a99fff!important;border-color:rgba(133,119,255,.45)!important}

/* Historial / Progreso */
.hist-day-name,.checkin-date{color:#fbfcff!important}
.hist-date,.hist-subnote,.hist-ex-sets,.checkin-note{color:#a5adbf!important}
.hist-pill,.checkin-pill{background:#1a1f2a!important;border-color:#384051!important;color:#c1c7d5!important}
.record-pill{font-weight:700}
.compare-lbl,.strength-name{color:#c3c9d7!important}
.compare-val,.strength-val,.body-hist-val{color:#f8f9fd!important}

/* Modal */
.modal{background:linear-gradient(180deg,#151820 0%,#10131a 100%);border-color:#3a4152;border-radius:18px 18px 0 0;box-shadow:0 -18px 44px rgba(0,0,0,.44)}
.modal-hdr{color:#fbfcff}
.modal-close{color:#c3c9d7}
.fin-row{border-bottom-color:#343a48}
.fin-lbl{color:#a5adbf}
.fin-val{color:#f7f8fc}

/* Exportar */
.exp-btn{background:#141821;border-color:#363d4e;color:#c0c7d6;border-radius:13px;font-weight:700}
.info-box{background:#12161e;border-color:#343a48;color:#a5adbf}

@media(max-width:420px){
  .container{padding-left:12px;padding-right:12px}
  .app-title{font-size:23px}
  .sets-header,.set-row{grid-template-columns:34px 1fr 1fr 42px;gap:6px!important}
  .sets-header span{font-size:9px!important}
  .set-input{font-size:14px!important;padding:9px 4px!important}
  .set-prev{font-size:10px!important}
}


/* ════════════════════════════════════════════════════════════════════
   FASE 1.2 — VISUAL POLISH INICIO + BIBLIOTECA
   Solo estética: rutinas, editor, biblioteca, modales y listas.
   ════════════════════════════════════════════════════════════════════ */

/* Inicio: paneles y acciones */
.editor-actions{
  gap:10px!important;
  margin-bottom:14px!important;
}
.editor-actions .btn{
  background:linear-gradient(180deg,#151924 0%,#11141d 100%)!important;
  border:1px solid #394052!important;
  color:#d4d9e7!important;
  box-shadow:0 8px 20px rgba(0,0,0,.14);
}
.editor-actions .btn-primary{
  background:linear-gradient(135deg,#8577ff,#6d5cff)!important;
  border-color:#8577ff!important;
  color:#fff!important;
}
.editor-actions .btn:active{transform:scale(.98)}

.editor-panel{
  padding:14px!important;
  margin-bottom:12px!important;
}
.editor-row{
  gap:10px!important;
  margin-bottom:10px!important;
}
.editor-grid{
  gap:10px!important;
}
.editor-label{
  font-size:10px!important;
  color:#c8cede!important;
  letter-spacing:.55px!important;
  font-weight:800!important;
}
.editor-input,.editor-select{
  min-height:44px!important;
  padding:11px 12px!important;
  background:#181c25!important;
  border:1px solid #3a4152!important;
  color:#f7f8fc!important;
  border-radius:12px!important;
}
.editor-input::placeholder{color:#858da0!important}
.editor-select option{background:#11131a;color:#f7f8fc}

/* Rutinas / días / ejercicios del editor */
.editor-ex{
  background:linear-gradient(180deg,#191d27 0%,#151923 100%)!important;
  border:1px solid #394052!important;
  border-radius:14px!important;
  padding:12px!important;
  margin-bottom:9px!important;
  box-shadow:0 6px 16px rgba(0,0,0,.13);
}
.editor-ex-top{
  gap:10px!important;
}
.editor-ex-name{
  font-size:14px!important;
  font-weight:800!important;
  color:#fbfcff!important;
}
.editor-ex-meta{
  color:#a8b0c2!important;
  font-size:11px!important;
  margin-top:5px!important;
}
.editor-mini-actions{
  gap:6px!important;
}
.editor-icon-btn{
  width:31px!important;
  height:31px!important;
  border-radius:9px!important;
  border:1px solid #41485a!important;
  background:#202431!important;
  color:#c5cbda!important;
}
.editor-icon-btn:active{
  border-color:#8577ff!important;
  color:#fff!important;
  background:#272c3a!important;
}
.editor-icon-btn.danger:active{
  border-color:#ff5f5f!important;
  color:#ff8b8b!important;
}

/* Biblioteca: barra superior */
.lib-toolbar{
  grid-template-columns:1fr 122px!important;
  gap:10px!important;
  margin-bottom:12px!important;
}
.lib-search{
  min-height:44px!important;
  background:#181c25!important;
  border:1px solid #3a4152!important;
  color:#f7f8fc!important;
  border-radius:12px!important;
  padding:11px 13px!important;
}
.lib-search::placeholder{color:#858da0!important}
.lib-list{
  max-height:52vh!important;
  padding-right:3px!important;
}

/* Biblioteca: items */
.lib-ex-item{
  background:linear-gradient(180deg,#171b25 0%,#141821 100%);
  border:1px solid #333a4a!important;
  border-radius:13px!important;
  padding:12px!important;
  margin-bottom:8px;
}
.lib-ex-item:hover,.lib-ex-item:active{
  background:#1b202b!important;
  border-color:#4b5367!important;
}
.lib-ex-name{
  font-size:14px!important;
  font-weight:800!important;
  color:#fbfcff!important;
}
.lib-ex-tags{
  gap:5px!important;
  margin-top:6px!important;
}
.lib-tag{
  font-size:10px!important;
  padding:3px 8px!important;
  border-radius:999px!important;
  background:#202431!important;
  border:1px solid #3b4252!important;
  color:#b2bacb!important;
}
.lib-tag.primary{
  background:rgba(133,119,255,.16)!important;
  border-color:rgba(133,119,255,.48)!important;
  color:#b8afff!important;
}
.lib-current-badge{
  background:rgba(62,207,142,.14)!important;
  border-color:rgba(62,207,142,.48)!important;
  color:#68e6aa!important;
  font-weight:800!important;
}

/* Biblioteca: secciones, ficha y GIF */
.lib-section-title{
  color:#a9b1c4!important;
  font-weight:800!important;
  letter-spacing:.65px!important;
  margin:14px 0 8px!important;
}
.lib-detail{
  background:linear-gradient(180deg,#181c25 0%,#141821 100%)!important;
  border:1px solid #394052!important;
  border-radius:15px!important;
  padding:14px!important;
}
.lib-gif-placeholder{
  min-height:150px!important;
  background:radial-gradient(circle at center,#242938 0%,#181c25 55%,#141821 100%)!important;
  border:1px dashed #4a5266!important;
  color:#a9b1c4!important;
  border-radius:14px!important;
  font-weight:700!important;
}
.exercise-gif{
  background:#11141d!important;
  border:1px solid #394052!important;
  border-radius:14px!important;
}
.gif-status{
  color:#9da5b8!important;
}
.muscle-pills{
  gap:6px!important;
  margin-top:10px!important;
}
.muscle-pill{
  font-size:10px!important;
  padding:4px 8px!important;
  border-radius:999px!important;
  background:#202431!important;
  border:1px solid #3b4252!important;
  color:#b9c0d0!important;
}

/* Modal de biblioteca/editor */
.modal .editor-row,
.modal .editor-grid{
  margin-bottom:10px!important;
}
.modal .btn{
  margin-top:8px;
}
.modal .btn:first-of-type{
  margin-top:10px;
}
.modal .lib-detail + .btn,
.modal .lib-list + .btn{
  margin-top:10px;
}

/* Tarjetas de rutina de Inicio, aunque usen clases genéricas */
#app .editor-panel:first-of-type{
  position:relative;
}
#app .editor-panel:first-of-type::before{
  content:'';
  position:absolute;
  left:14px;
  right:14px;
  top:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(133,119,255,.55),transparent);
}

/* Mejor lectura de acciones pequeñas */
.hist-del-btn,.editor-icon-btn,.ex-swap-btn,.hist-detail-btn{
  font-weight:800!important;
}
.page-sub{
  color:#9aa2b5!important;
}

/* Responsive Inicio/Biblioteca */
@media(max-width:420px){
  .editor-actions{
    gap:8px!important;
  }
  .editor-actions .btn{
    font-size:12px!important;
    padding-left:8px!important;
    padding-right:8px!important;
  }
  .lib-toolbar{
    grid-template-columns:1fr!important;
  }
  .editor-grid{
    grid-template-columns:1fr!important;
  }
}


/* ════════════════════════════════════════════════════════════════════
   FASE 1.3 — VISUAL POLISH HISTORIAL + PROGRESO + EXPORTAR
   Solo estética: filtros, cards, check-ins, gráficos, fuerza, fotos, backup.
   ════════════════════════════════════════════════════════════════════ */

/* Segmentos de Progreso */
.seg{
  background:#11141d!important;
  border:1px solid #303746!important;
  border-radius:14px!important;
  padding:4px!important;
  gap:4px!important;
  box-shadow:0 8px 20px rgba(0,0,0,.14);
}
.seg-btn{
  min-height:34px!important;
  border-radius:10px!important;
  color:#939caf!important;
  font-weight:800!important;
  font-size:11px!important;
}
.seg-btn.active{
  background:linear-gradient(180deg,#202536 0%,#191e2b 100%)!important;
  border:1px solid #444c60!important;
  color:#f6f7fb!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}

/* Historial Pro */
.hist-filter-grid{
  gap:10px!important;
}
.hist-actions{
  background:#151923;
  border:1px solid #323948;
  border-radius:13px;
  padding:10px;
  margin-top:12px!important;
}
.hist-actions label{
  color:#c5cbda!important;
  font-weight:700;
}
.hist-actions input[type="checkbox"]{
  width:18px;
  height:18px;
  accent-color:#8577ff;
}
.hist-session{
  padding:15px!important;
  margin-bottom:11px!important;
}
.hist-session-top{
  gap:10px!important;
  margin-bottom:10px!important;
}
.hist-day-name{
  font-size:15px!important;
  letter-spacing:-.1px;
}
.hist-date{
  font-size:11px!important;
  color:#a7afc1!important;
  margin-top:3px!important;
}
.hist-detail-btn{
  min-height:31px!important;
  padding:7px 11px!important;
  background:#1b202b!important;
  border:1px solid #3e4658!important;
  color:#c8cede!important;
  border-radius:9px!important;
}
.hist-del-btn{
  min-height:31px!important;
  padding:7px 10px!important;
  background:rgba(255,95,95,.08)!important;
  border:1px solid rgba(255,95,95,.25)!important;
  color:#ff9a9a!important;
  border-radius:9px!important;
}
.hist-pills{
  gap:6px!important;
  margin-bottom:10px!important;
}
.hist-pill{
  padding:5px 9px!important;
  border-radius:999px!important;
  font-weight:700!important;
  font-size:10px!important;
}
.hist-pill.a{
  background:rgba(133,119,255,.16)!important;
  border-color:rgba(133,119,255,.48)!important;
  color:#b8afff!important;
}
.hist-subnote{
  color:#adb5c7!important;
  background:#151923;
  border:1px solid #303746;
  border-radius:12px;
  padding:9px 10px;
}
.hist-detail-list{
  gap:9px!important;
  margin-top:10px!important;
}
.hist-detail-ex{
  background:linear-gradient(180deg,#181d27 0%,#151923 100%)!important;
  border:1px solid #363e4f!important;
  border-radius:14px!important;
  padding:11px!important;
}
.hist-detail-name{
  font-size:13px!important;
  color:#fbfcff!important;
}
.hist-detail-metrics{
  color:#a99fff!important;
  font-weight:800!important;
}
.hist-detail-line{
  color:#aeb6c8!important;
  font-size:11px!important;
}
.hist-mini-card{
  background:#202431!important;
  border-color:#3a4253!important;
  border-radius:10px!important;
}
.hist-mini-val{
  color:#fbfcff!important;
  font-size:13px!important;
}
.hist-mini-lbl{
  color:#9ca5b8!important;
  font-weight:800!important;
}
.record-pills{
  gap:6px!important;
  margin-top:10px!important;
}
.record-pill{
  padding:5px 9px!important;
  background:rgba(245,166,35,.13)!important;
  border-color:rgba(245,166,35,.45)!important;
  color:#ffc56c!important;
  border-radius:999px!important;
}

/* Progreso corporal */
.metric-row{
  gap:10px!important;
}
.metric-card{
  padding:12px!important;
  border-radius:14px!important;
}
.metric-card-val{
  font-size:19px!important;
  letter-spacing:-.2px;
}
.metric-card-lbl{
  font-size:9px!important;
  color:#9da6ba!important;
}
.metric-card-delta{
  font-size:11px!important;
  font-weight:700!important;
}
.metric-card-delta.down{
  color:#ff7f7f!important;
}
.metric-card-delta.neutral{
  color:#9ea7ba!important;
}
.progress-note{
  background:#151923;
  border:1px solid #303746;
  border-radius:12px;
  padding:9px 10px;
  margin:8px 0 12px!important;
}
.compare-list{
  background:#151923;
  border:1px solid #303746;
  border-radius:13px;
  padding:4px 10px;
}
.compare-row{
  padding:9px 0!important;
  border-bottom-color:#303746!important;
}
.compare-head{
  color:#9da6ba!important;
  font-weight:800!important;
}
.compare-lbl{
  font-weight:800!important;
}
.compare-delta{
  font-weight:800!important;

// STORAGE  (versioned key gl3_)
// ════════════════════════════════════════════════════════════════════
const gs = k=>{try{return JSON.parse(localStorage.getItem('gl3_'+k))}catch{return null}};
const gw = (k,v)=>localStorage.setItem('gl3_'+k,JSON.stringify(v));

// Load/save routines from storage so user modifications persist
function makeRoutinePlan(name='Rutina nueva', days=[]){
  return {id:'routine_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),name,createdAt:Date.now(),days};
}
function getRoutinePlans(){
  const saved = gs('routinePlans');
  if(Array.isArray(saved)) return saved;
  const oldRoutine = gs('routine');
  const baseDays = oldRoutine && Array.isArray(oldRoutine) && oldRoutine.length ? oldRoutine : JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
  const plans = [{id:'routine_default',name:'Rutina principal',createdAt:Date.now(),days:baseDays}];
  gw('routinePlans',plans);
  if(!gs('activeRoutineId')) gw('activeRoutineId','routine_default');
  return plans;
}

function saveRoutinePlans(plans){ gw('routinePlans',plans); }
function getActiveRoutineId(){
  const plans=getRoutinePlans();
  if(!plans.length)return null;
  const id=gs('activeRoutineId');
  if(id && plans.some(p=>p.id===id)) return id;
  gw('activeRoutineId',plans[0].id);
  return plans[0].id;
}

function getActiveRoutinePlan(){
  const plans=getRoutinePlans();
  const activeId=getActiveRoutineId();
  return plans.find(p=>p.id===activeId) || plans[0] || null;
}

function getRoutine(){
  const plan=getActiveRoutinePlan();
  return plan && Array.isArray(plan.days) ? plan.days : [];
}
function saveRoutine(r){
  const plans=getRoutinePlans();
  const id=getActiveRoutineId();
  if(!id)return;
  const plan=plans.find(p=>p.id===id);
  if(plan) plan.days=r;
  saveRoutinePlans(plans);
  gw('routine', r); // compatibilidad con backups antiguos
}

function setActiveRoutinePlan(id,doRender=true){
  const plans=getRoutinePlans();
  if(!plans.some(p=>p.id===id))return;
  if(S?.sessionActive){toast('Finaliza o descarta el entrenamiento activo antes de cambiar de rutina');return;}
  gw('activeRoutineId',id);
  ROUTINE=getRoutine();
  S.dayIdx=0; S.sessionSets={}; S.sessionHiddenEx=[]; S.openEx={};
  if(doRender)render();
}

function summarizeExerciseSets(sets){
  if(!sets||!sets.length)return null;
  const volume=sets.reduce((a,s)=>a+s.weight*s.reps,0);
  const maxWeight=Math.max(...sets.map(s=>s.weight));
  const best1rm=Math.max(...sets.map(s=>e1rm(s.weight,s.reps)));
  const totalReps=sets.reduce((a,s)=>a+s.reps,0);
  const bestSet=sets.slice().sort((a,b)=>(e1rm(b.weight,b.reps)-e1rm(a.weight,a.reps))||(b.weight-a.weight)||(b.reps-a.reps))[0];
  return {volume,maxWeight,best1rm,totalReps,bestSet,line:sets.map(s=>`${s.weight}×${s.reps}`).join(' · ')};

  let bestWeight=0,best1rm=0,bestVolume=0;
  for(let i=0;i<h.length;i++){
    const sets=getDoneSetsForExerciseSession(h[i],exId);
    if(!sets.length)continue;
    sessions++;
    const sum=summarizeExerciseSets(sets);
    if(!sum)continue;
    bestWeight=Math.max(bestWeight,sum.maxWeight);
    best1rm=Math.max(best1rm,sum.best1rm);
    bestVolume=Math.max(bestVolume,sum.volume);

    const set1rm=e1rm(s.weight,s.reps);
    if(s.weight>hist.bestWeight+0.04)prs.push({type:'Peso',value:`${s.weight.toFixed(1)} kg`});
    if(set1rm>hist.bestE1rm+0.04)prs.push({type:'1RM',value:`${set1rm.toFixed(1)} kg`});
    const k=String(Number(s.weight).toFixed(2));
    if(hist.bestRepsByWeight[k]!==undefined&&s.reps>hist.bestRepsByWeight[k])prs.push({type:'Reps con peso',value:`${s.weight.toFixed(1)}×${s.reps}`});
  });
  if(sum&&sum.volume>hist.bestVolume+0.4)prs.push({type:'Volumen',value:`${sum.volume.toFixed(0)} kg`});
  return dedupePrs(prs);
}
function prAlertKey(exId,pr){return `${exId}_${pr.type}_${pr.value}`;}
function freshSessionPRs(exId,prs){
  if(!S.sessionPrAlerts)S.sessionPrAlerts={};
  const fresh=[];
  prs.forEach(pr=>{
    const k=prAlertKey(exId,pr);
    if(!S.sessionPrAlerts[k]){S.sessionPrAlerts[k]=Date.now();fresh.push(pr);}
  });
  return fresh;
}
function formatPRToast(exName,prs){
  if(!prs||!prs.length)return '';
  const first=prs[0];
  const extra=prs.length>1?` +${prs.length-1}`:'';
  return `🏆 Récord: ${exName} · ${first.type} ${first.value}${extra}`;
}
function buildSmartPrHtml(exId){
  const prs=detectExercisePRs(exId,true);
  if(!prs.length)return '';
  return `<div class="smart-pr-list">${prs.slice(0,4).map(pr=>`<span class="smart-pr-pill">🏆 <strong>${esc(pr.type)}</strong> ${esc(pr.value)}</span>`).join('')}</div>`;
}
function parseRepsTargetRange(target){
  const raw=String(target||'').toLowerCase();
  if(raw.includes('amrap'))return null;
  const nums=(raw.match(/\d+/g)||[]).map(Number);
  if(!nums.length)return null;
  if(nums.length===1)return {min:nums[0],max:nums[0]};
  return {min:Math.min(nums[0],nums[1]),max:Math.max(nums[0],nums[1])};
}
function suggestedIncrement(weight){
  const w=parseFloat(weight)||0;
  if(w>=80)return 5;
  if(w>=30)return 2.5;
  if(w>0)return 1;
  return 2.5;
}
function buildProgressionSuggestion(exId,repsTarget){
  if(!S.sessionActive)return '';
  const sets=currentDoneSetsForPR(exId);
  if(!sets.length){
    return `<div class="smart-suggestion"><div class="smart-suggestion-top"><div class="smart-suggestion-title">Sugerencia próxima sesión</div><span class="smart-suggestion-badge hold">Pendiente</span></div><div class="smart-suggestion-text">Marca series completadas para calcular una recomendación real.</div></div>`;
  }
  const range=parseRepsTargetRange(repsTarget);
  const sum=summarizeExerciseSets(sets);
  if(!sum)return '';
  const maxW=sum.maxWeight;
  const inc=suggestedIncrement(maxW);
  const minReps=Math.min(...sets.map(s=>s.reps));
  const avgReps=sets.reduce((a,s)=>a+s.reps,0)/sets.length;
  const sameWeightSets=sets.filter(s=>Math.abs(s.weight-maxW)<0.01);
  const sameWeightMin=sameWeightSets.length?Math.min(...sameWeightSets.map(s=>s.reps)):minReps;

  let mode='hold',label='Mantener',text='Mantén el peso la próxima sesión y busca repetir o mejorar reps con buena técnica.';

  if(range){
    if(sets.length>=2 && sameWeightSets.length>=2 && sameWeightMin>=range.max){
      mode='up'; label='Subir peso';
      text=`Has alcanzado el rango alto con <strong>${maxW.toFixed(1)} kg</strong>. Próxima sesión: prueba <strong>${(maxW+inc).toFixed(1)} kg</strong> y vuelve al rango bajo de reps.`;
    }else if(minReps<range.min){
      mode='down'; label='Ajustar';
      text=`Alguna serie quedó por debajo del rango objetivo (${range.min}-${range.max}). Próxima sesión: mantén o baja ligeramente el peso hasta consolidar reps.`;
    }else{
      mode='hold'; label='Mantener';
      text=`Estás dentro del rango objetivo (${range.min}-${range.max}). Próxima sesión: mantén <strong>${maxW.toFixed(1)} kg</strong> e intenta sumar reps antes de subir.`;
    }
  }else{
    if(avgReps>=15 && sets.length>=2){
      mode='up'; label='Subir peso';
      text=`Media alta de reps (${avgReps.toFixed(1)}). Próxima sesión: prueba una subida prudente hasta <strong>${(maxW+inc).toFixed(1)} kg</strong>.`;
    }else if(avgReps<6){
      mode='down'; label='Ajustar';
      text=`Media baja de reps (${avgReps.toFixed(1)}). Prioriza técnica y controla el peso antes de subir.`;
    }
  }

  return `<div class="smart-suggestion"><div class="smart-suggestion-top"><div class="smart-suggestion-title">Sugerencia próxima sesión</div><span class="smart-suggestion-badge ${mode}">${label}</span></div><div class="smart-suggestion-text">${text}</div></div>`;
}

function initSets(exId,n){
  if(!exId)return;
  const target=Math.max(1,parseInt(n)||1);
  if(!S.sessionSets||typeof S.sessionSets!=='object')S.sessionSets={};
  if(!Array.isArray(S.sessionSets[exId]))S.sessionSets[exId]=[];
  S.sessionSets[exId]=S.sessionSets[exId].map(sanitizeSet);
  while(S.sessionSets[exId].length<target)S.sessionSets[exId].push({weight:'',reps:'',done:false});
}
function saveSesh(){
  try{
    if(S.sessionActive){
      normalizeSessionState();
      gw('activeSession',{
        dayIdx:S.dayIdx,
        sessionStart:S.sessionStart||Date.now(),
        sessionSets:safeJsonClone(S.sessionSets,{}),
        sessionHiddenEx:[...(S.sessionHiddenEx||[])],
        restEndAt:S.restEndAt||null,
        sessionPrAlerts:{...(S.sessionPrAlerts||{})}
      });
    }
  }catch(err){
    console.error('No se pudo guardar sesión activa',err);
    safeToast('No se pudo guardar la sesión activa');
  }
}
function visibleExercises(day){
  if(!day||!Array.isArray(day.exercises)) return [];
  const hidden=new Set(Array.isArray(S.sessionHiddenEx)?S.sessionHiddenEx:[]);
  if(!S.sessionActive) return day.exercises;
  return day.exercises.filter(ex=>ex&&ex.id&&!hidden.has(ex.id));
}
function countDone(){
  let done=0,total=0;
  try{
    visibleExercises(ROUTINE[S.dayIdx]).forEach(ex=>{
      (S.sessionSets?.[ex.id]||[]).forEach(s=>{total++;if(s?.done)done++;});
    });
  }catch(err){console.error('Error contando series',err);}
  return{done,total};
}

function syncWorkoutElapsed(){
  if(S.sessionActive&&S.sessionStart){S.workoutElapsed=Math.max(0,Math.floor((Date.now()-S.sessionStart)/1000));}
  const el=document.getElementById('wt');
  if(el)el.textContent=fmt(S.workoutElapsed);
}
function startWorkoutTimer(){
  if(S.workoutTimer)clearInterval(S.workoutTimer);
  syncWorkoutElapsed();
  S.workoutTimer=setInterval(syncWorkoutElapsed,1000);
}
function stopWorkoutTimer(){if(S.workoutTimer){clearInterval(S.workoutTimer);S.workoutTimer=null;}}
function updateRestClock(){
  if(!S.restActive||!S.restEndAt)return;
  S.restRemaining=Math.max(0,Math.ceil((S.restEndAt-Date.now())/1000));
  const el=document.getElementById('rest-time');
  if(el)el.textContent=fmt(S.restRemaining);
  if(S.restRemaining<=0){
    if(S.restTimer){clearInterval(S.restTimer);S.restTimer=null;}
    S.restActive=false; S.restEndAt=null;
    document.getElementById('rest-banner')?.remove();
    saveSesh(); toast('⏱ ¡Descanso terminado!');
  }
}
function startRest(sec){
  if(S.restTimer)clearInterval(S.restTimer);
  S.restActive=true; S.restEndAt=Date.now()+sec*1000;
  S.restRemaining=sec;
  saveSesh(); renderRestBanner(); updateRestClock();
  S.restTimer=setInterval(updateRestClock,1000);
}
function adjustRest(d){
  if(!S.restActive)return;
  const current=S.restEndAt||Date.now()+S.restRemaining*1000;
  S.restEndAt=Math.max(Date.now()+5000,current+d*1000);
  updateRestClock(); saveSesh();
}
function skipRest(){
  if(S.restTimer){clearInterval(S.restTimer);S.restTimer=null;}
  S.restActive=false; S.restEndAt=null; S.restRemaining=0;
  saveSesh();
  document.getElementById('rest-banner')?.remove();
}
function renderRestBanner(){
  let rb=document.getElementById('rest-banner');
  if(!rb){rb=mk('div','rest-banner');rb.id='rest-banner';document.querySelector('.workout-header')?.after(rb);}
  rb.innerHTML=`<div class="rest-left"><div class="rest-lbl">Descanso</div><div class="rest-time" id="rest-time">${fmt(S.restRemaining)}</div></div>
  <div class="rest-right">
    <div class="rest-adj">
      <button class="radj" onclick="adjustRest(-15)">−15s</button>
      <button class="radj" onclick="adjustRest(15)">+15s</button>
      <button class="radj" onclick="adjustRest(30)">+30s</button>
    </div>
    <button class="rest-skip" onclick="skipRest()">Saltar →</button>
  </div>`;
}

function render(){
  try{Object.values(S.chartInstances||{}).forEach(c=>{try{c.destroy();}catch{}});}catch{}
  S.chartInstances={};
  normalizeSessionState();
  const app=document.getElementById('app');
  if(!app)return;
  app.innerHTML='';
  try{
    if(S.page==='home') renderHome(app);
    else if(S.page==='gym') renderGym(app);
    else if(S.page==='history') renderHistory(app);
    else if(S.page==='progress') renderProgress(app);
    else if(S.page==='export') renderExport(app);
    else{S.page='home';renderHome(app);}
  }catch(err){
    console.error('Error renderizando página',S.page,err);
    appErrorBox(app,'Error al cargar esta pantalla',err);
  }
  ['home','gym','history','progress','export'].forEach(p=>{
    try{document.getElementById('nav-'+p)?.classList.toggle('active',S.page===p);}catch{}
  });
  try{if(S.sessionActive) startWorkoutTimer();}catch(err){console.error('Error timer entrenamiento',err);}
  try{if(S.restActive){updateRestClock(); if(!S.restTimer)S.restTimer=setInterval(updateRestClock,1000);}}catch(err){console.error('Error timer descanso',err);}
}

function duplicateRoutinePlan(planId){
  const plans=getRoutinePlans();
  const p=plans.find(x=>x.id===planId);
  if(!p)return;
  const copy=makeRoutinePlan((p.name||'Rutina')+' copia',JSON.parse(JSON.stringify(p.days||[])));
  copy.days.forEach(d=>{
    d.id='day_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
    (d.exercises||[]).forEach(ex=>ex.id='ex_'+Date.now()+'_'+Math.random().toString(36).slice(2,6));
  });
  plans.push(copy);
  saveRoutinePlans(plans);
  toast('Rutina duplicada');
  render();
}
function deleteRoutinePlan(planId){
  const plans=getRoutinePlans();
  const plan=plans.find(p=>p.id===planId);
  if(!plan)return;

  if(S?.sessionActive && planId===getActiveRoutineId()){
    toast('Finaliza o descarta el entrenamiento activo antes de borrar esta rutina');
    return;
  }

  if(!confirm(`¿Borrar la rutina "${plan.name||'sin nombre'}"?`))return;

  const remaining=plans.filter(p=>p.id!==planId);
  saveRoutinePlans(remaining);

  const activeId=getActiveRoutineId();
  if(!remaining.length){
    gw('activeRoutineId',null);
    ROUTINE=[];
    S.dayIdx=0;
    S.sessionSets={};
    S.sessionHiddenEx=[];
    S.openEx={};
    closeModal();
    toast('Rutina borrada. No queda ninguna rutina.');
    render();
    return;
  }

  if(planId===activeId || !remaining.some(p=>p.id===activeId)){
    gw('activeRoutineId',remaining[0].id);
  }

  ROUTINE=getRoutine();
  S.dayIdx=0;
  S.sessionSets={};
  S.sessionHiddenEx=[];
  S.openEx={};
  closeModal();
  toast('Rutina borrada');
  render();
}

    const fb=mk('button','btn btn-success','Finalizar');
    fb.onclick=finishSession;
    const db=mk('button','btn btn-danger','Descartar');
    db.onclick=()=>{if(confirm('¿Descartar entrenamiento?'))discardSession();};
    row.appendChild(fb); row.appendChild(db);
    btnWrap.appendChild(row);
  }
  app.appendChild(btnWrap);

  // Exercises
  visibleExercises(day).forEach(ex=>app.appendChild(buildExCard(ex)));
}


function discardSession(doRender=true){
  stopWorkoutTimer(); skipRest();
  S.sessionActive=false; S.sessionStart=null; S.sessionSets={}; S.sessionHiddenEx=[]; S.sessionPrAlerts={}; S.workoutElapsed=0; S.restEndAt=null;

  if(doRender)render();
}

function removeExerciseFromSession(exId){
  if(!S.sessionActive)return;
  if(!confirm('¿Quitar este ejercicio solo de esta sesión?'))return;
  if(!S.sessionHiddenEx.includes(exId)) S.sessionHiddenEx.push(exId);
  delete S.sessionSets[exId];
  delete S.openEx[exId];
  saveSesh();
  toast('Ejercicio quitado de esta sesión');
  render();
}

function buildSetRow(ex,idx,s,allSets){
  const row=mk('div','set-row');
  row.appendChild(mk('div','set-num',String(idx+1)));

  const wi=document.createElement('input');
  wi.className='set-input'+(s.weight?' filled':'');
  wi.type='number';
  wi.inputMode='decimal';
  wi.placeholder='0';
  wi.value=s.weight||'';
  wi.disabled=!S.sessionActive;
  wi.oninput=e=>{
    try{
      initSets(ex.id,idx+1);
      S.sessionSets[ex.id][idx].weight=e.target.value;
      saveSesh();
      updateSmartLiveComparison(ex.id,ex.repsTarget);
    }catch(err){console.error('Error peso serie',err);}
  };

  const ri=document.createElement('input');
  ri.className='set-input'+(s.reps?' filled':'');
  ri.type='number';
  ri.inputMode='numeric';
  ri.placeholder='0';
  ri.value=s.reps||'';
  ri.disabled=!S.sessionActive;
  ri.oninput=e=>{
    try{
      initSets(ex.id,idx+1);
      S.sessionSets[ex.id][idx].reps=e.target.value;
      saveSesh();
      updateSmartLiveComparison(ex.id,ex.repsTarget);
    }catch(err){console.error('Error reps serie',err);}
  };

  row.appendChild(wi);
  row.appendChild(ri);

  const db=mk('button','set-done-btn'+(s.done?' done':''),s.done?'✓':'○');
  db.disabled=!S.sessionActive;
  db.onclick=()=>{
    if(!S.sessionActive)return;
    const cur=S.sessionSets[ex.id][idx];
    if(!cur)return;

    cur.done=!cur.done;

    if(cur.done){
      if(!cur.weight&&!cur.reps){
        const h=gs('history')||[];
        for(let i=h.length-1;i>=0;i--){
          if(h[i].sets&&h[i].sets[ex.id]&&h[i].sets[ex.id][idx]){
            const ps=h[i].sets[ex.id][idx];
            if(ps.weight)cur.weight=ps.weight;
            if(ps.reps)cur.reps=ps.reps;
            break;
          }
        }
      }

      try{startRest(ex.rest);}catch(err){console.error('Error iniciando descanso',err);}

      try{
        const prs=(typeof freshSessionPRs==='function'&&typeof detectExercisePRs==='function')
          ? freshSessionPRs(ex.id,detectExercisePRs(ex.id,false))
          : [];
        if(prs&&prs.length)toast(formatPRToast(ex.name,prs));
        else toast(`Serie ${idx+1} completada · desc ${fmt(ex.rest)}`);
      }catch(err){
        console.error('Error detectando récord',err);
        toast(`Serie ${idx+1} completada`);
      }
    }else{
      try{skipRest();}catch(err){console.error('Error cancelando descanso',err);}
    }

    saveSesh();
    render();
  };
  row.appendChild(db);

  if(S.sessionActive&&Array.isArray(allSets)&&allSets.length>1){
    const del=mk('button','set-del-btn','×');
    del.onclick=()=>{
      if(Array.isArray(S.sessionSets[ex.id])){
        S.sessionSets[ex.id].splice(idx,1);
        saveSesh();
        render();
      }
    };
    row.appendChild(del);
  }else{
    row.appendChild(mk('div','set-del-spacer',''));
  }

  return row;
}

  html+=`<div class="editor-row"><select class="editor-select" id="picker-equipment" onchange="openExercisePicker(${dayIdx},${replaceExId?`'${replaceExId}'`:'null'},document.querySelector('.lib-search').value,document.getElementById('picker-muscle').value,this.value)">${EQUIPMENT_FILTERS.map(e=>`<option ${e===equipment?'selected':''}>${e}</option>`).join('')}</select><button class="btn btn-ghost btn-sm" onclick="openCustomExerciseForm(${dayIdx},${replaceExId?`'${replaceExId}'`:'null'})">+ Crear</button></div>`;
  html+=`<div class="lib-list">`;
  if(!lib.length){html+=`<div style="font-size:12px;color:var(--text3);padding:18px;text-align:center">No hay ejercicios con esos filtros.</div>`;}

}
function applyExerciseFromLibrary(dayIdx, replaceExId, exerciseId){
  const item=getExLibItem(exerciseId); if(!item)return;
  const day=ROUTINE[dayIdx];
  if(replaceExId){
    const idx=day.exercises.findIndex(e=>e.id===replaceExId); if(idx===-1)return;
    const old=day.exercises[idx];
    day.exercises[idx]={...routineExFromLib(item,{id:old.id,sets:old.sets,repsTarget:old.repsTarget,rest:old.rest})};
    delete S.sessionSets[old.id];
  }else{
    day.exercises.push(routineExFromLib(item));
  }
  saveRoutine(ROUTINE);
  toast(replaceExId?'Ejercicio cambiado':'Ejercicio añadido');
  openRoutineEditor(dayIdx);
}
function swapExercise(dayIdx, oldExId, newLibId){applyExerciseFromLibrary(dayIdx,oldExId,newLibId);}
function exerciseGifHtml(e){

function resolveExerciseProfile(exerciseId){
  const id=String(exerciseId||'');
  const lib=getExLibItem(id);
  if(lib)return {...lib,profileId:lib.id,source:'library'};

  let found=null;
  getRoutinePlans().forEach(p=>(p.days||[]).forEach(d=>(d.exercises||[]).forEach(ex=>{
    if(found)return;
    if(String(ex.id)===id||String(ex.exerciseId||'')===id)found=ex;
  })));
  if(!found){
    ROUTINE.forEach(d=>(d.exercises||[]).forEach(ex=>{
      if(found)return;
      if(String(ex.id)===id||String(ex.exerciseId||'')===id)found=ex;
    }));
  }
  if(found){
    const linked=found.exerciseId?getExLibItem(found.exerciseId):null;
    return {
      ...(linked||{}),
      ...found,
      id:found.exerciseId||found.id,
      profileId:found.exerciseId||found.id,
      source:'routine',
      defaultSets:found.sets,
      defaultReps:found.repsTarget,
      defaultRest:found.rest,
      instructions:(linked&&linked.instructions)||[],
      mistakes:(linked&&linked.mistakes)||[],
      secondaryMuscles:found.secondaryMuscles||(linked&&linked.secondaryMuscles)||[]
    };
  }
  return null;
}
function profileMatchesExercise(profile,exId,histEx=null){
  if(!profile)return false;
  const pid=String(profile.profileId||profile.id||'');
  const direct=String(exId||'');
  if(pid&&direct&&pid===direct)return true;
  if(histEx){
    if(pid&&String(histEx.id||'')===pid)return true;
    if(pid&&String(histEx.exerciseId||'')===pid)return true;
    if(profile.name&&histEx.name&&String(profile.name).toLowerCase()===String(histEx.name).toLowerCase())return true;
  }
  const name=String(profile.name||'').toLowerCase();
  if(!name)return false;
  let routineMatch=false;
  getRoutinePlans().forEach(p=>(p.days||[]).forEach(d=>(d.exercises||[]).forEach(ex=>{
    if(routineMatch)return;
    if(String(ex.id)===direct&&(String(ex.exerciseId||'')===pid||String(ex.name||'').toLowerCase()===name))routineMatch=true;
  })));
  return routineMatch;
}
function exerciseHistoryForProfile(profile){
  const history=gs('history')||[];
  const out=[];
  history.forEach(h=>{
    Object.keys(h.sets||{}).forEach(exId=>{
      const histEx=Array.isArray(h.exercises)?h.exercises.find(e=>String(e.id)===String(exId)):null;
      if(!profileMatchesExercise(profile,exId,histEx))return;
      const raw=(h.sets[exId]||[]).filter(s=>s&&s.done&&(parseFloat(s.weight)||0)&&(parseInt(s.reps)||0));
      if(!raw.length)return;
      const sets=raw.map(s=>({weight:parseFloat(s.weight)||0,reps:parseInt(s.reps)||0}));
      const sum=summarizeExerciseSets(sets);
      if(!sum)return;
      out.push({date:h.date,dayName:h.dayName||'',routineName:h.routineName||'',sets,...sum});
    });
  });
  return out.sort((a,b)=>b.date-a.date);
}
function exerciseProfileStats(sessions){
  const sets=sessions.flatMap(s=>s.sets||[]);
  if(!sessions.length||!sets.length)return {sessions:0,sets:0,bestWeight:0,best1rm:0,bestVolume:0,totalVolume:0,bestSet:'—'};
  const bestSet=sets.slice().sort((a,b)=>(e1rm(b.weight,b.reps)-e1rm(a.weight,a.reps))||(b.weight-a.weight)||(b.reps-a.reps))[0];
  return {
    sessions:sessions.length,
    sets:sets.length,
    bestWeight:Math.max(...sets.map(s=>s.weight)),
    best1rm:Math.max(...sets.map(s=>e1rm(s.weight,s.reps))),
    bestVolume:Math.max(...sessions.map(s=>s.volume||0)),
    totalVolume:sessions.reduce((a,s)=>a+(s.volume||0),0),
    bestSet:bestSet?`${bestSet.weight}×${bestSet.reps}`:'—'
  };
}
function exerciseProfileHistoryHtml(sessions){
  if(!sessions.length)return `<div class="hist-empty" style="padding:24px 14px">Todavía no hay historial guardado para este ejercicio.</div>`;
  return `<div class="exercise-history-list">${sessions.slice(0,10).map(s=>`<div class="exercise-history-row">
    <div class="exercise-history-top">
      <div><div class="exercise-history-date">${fmtD(s.date)}</div><div class="exercise-history-day">${esc(s.routineName||'Rutina')} · ${esc(s.dayName||'Día')}</div></div>
      <div class="exercise-history-vol">${(s.volume||0).toFixed(0)} kg</div>
    </div>
    <div class="exercise-history-sets">${esc((s.sets||[]).map(x=>`${x.weight}×${x.reps}`).join(' · '))}</div>
  </div>`).join('')}</div>`;
}
function exerciseProfileBestRecords(sessions){
  const all=[];
  sessions.forEach(sess=>(sess.sets||[]).forEach(set=>all.push({...set,date:sess.date,dayName:sess.dayName,routineName:sess.routineName,sessionVolume:sess.volume})));
  if(!sessions.length||!all.length)return null;
  const bestWeight=all.slice().sort((a,b)=>(b.weight-a.weight)||(b.reps-a.reps))[0];
  const best1rm=all.slice().sort((a,b)=>(e1rm(b.weight,b.reps)-e1rm(a.weight,a.reps))||(b.weight-a.weight))[0];
  const bestReps=all.slice().sort((a,b)=>(b.reps-a.reps)||(b.weight-a.weight))[0];
  const bestVolume=sessions.slice().sort((a,b)=>(b.volume-a.volume))[0];
  const bestTotalReps=sessions.slice().sort((a,b)=>(b.totalReps-a.totalReps))[0];
  const latest=sessions.slice().sort((a,b)=>b.date-a.date)[0];
  return {bestWeight,best1rm,bestReps,bestVolume,bestTotalReps,latest};
}

    ${exerciseProfileRecordCard('Última sesión',`${r.latest.volume.toFixed(0)} kg`,latestMeta,'🕘')}
  </div>`;

function exerciseProfileChartMetricDef(metric){
  const defs={
    maxWeight:{label:'Peso máximo',unit:'kg',value:s=>s.maxWeight||0},

    volume:{label:'Volumen',unit:'kg',value:s=>s.volume||0},
    totalReps:{label:'Reps totales',unit:'reps',value:s=>s.totalReps||0}
  };
  return defs[metric]||defs.maxWeight;
}

}
function drawExerciseProfileChart(){
  setTimeout(()=>{
    try{
      const ctx=document.getElementById('exercise-profile-chart');
      if(!ctx||typeof Chart==='undefined')return;
      const sessions=(S.exerciseProfileChartSessions||[]).slice().sort((a,b)=>a.date-b.date).slice(-30);
      if(!sessions.length)return;
      if(S.chartInstances.exerciseProfileChart){try{S.chartInstances.exerciseProfileChart.destroy();}catch{}}
      const metric=S.exerciseProfileChartMetric||'maxWeight';
      const def=exerciseProfileChartMetricDef(metric);
      S.chartInstances.exerciseProfileChart=new Chart(ctx,{
        type:'line',
        data:{
          labels:sessions.map(s=>fmtDs(s.date)),
          datasets:[{
            label:def.label,
            data:sessions.map(s=>def.value(s)),
            borderColor:'#8577ff',
            backgroundColor:'#8577ff18',
            borderWidth:2,
            pointRadius:3,
            pointBackgroundColor:'#8577ff',
            tension:.35,
            fill:true
          }]
        },
        options:{
          responsive:true,
          maintainAspectRatio:false,
          plugins:{
            legend:{display:false},
            tooltip:{callbacks:{label:c=>`${def.label}: ${c.parsed.y} ${def.unit}`}}
          },

function getProgressionPlans(){
  const p=gs('progressionPlans');
  return p&&typeof p==='object'?p:{};
}

function getProgressionHistory(){
  const h=gs('progressionHistory');

}
function saveProgressionHistory(h){gw('progressionHistory',Array.isArray(h)?h:[]);}
function progressionKeyFrom(exOrId,name=''){
  if(exOrId&&typeof exOrId==='object'){
    return String(exOrId.exerciseId||exOrId.profileId||exOrId.id||exOrId.name||'');
  }
  const id=String(exOrId||'');
  const profile=typeof resolveExerciseProfile==='function'?resolveExerciseProfile(id):null;
  if(profile)return String(profile.profileId||profile.exerciseId||profile.id||id);
  if(id)return id;
  return String(name||'').toLowerCase();
}
function progressionPlanFor(exOrId,name=''){
  const key=progressionKeyFrom(exOrId,name);
  return (getProgressionPlans()||{})[key]||null;
}
function progressionHistoryFor(exOrId,name=''){
  const key=progressionKeyFrom(exOrId,name);
  return getProgressionHistory().filter(x=>String(x.exerciseKey)===String(key)).sort((a,b)=>b.date-a.date);
}
function progressionTargetText(plan){
  if(!plan)return 'Sin objetivo';
  const w=parseFloat(plan.targetWeight)||0;
  const min=parseInt(plan.minReps)||0;
  const max=parseInt(plan.maxReps)||min;
  const sets=parseInt(plan.targetSets)||1;
  return `${sets}× ${w.toFixed(1)} kg · ${min}${max&&max!==min?'-'+max:''} reps`;
}
function progressionStatusLabel(status){
  return status==='completed'?'Cumplido':status==='exceeded'?'Superado':status==='missed'?'No cumplido':'Pendiente';
}
function currentGoalStatusForExercise(ex,plan){
  if(!plan)return {status:'none',label:'Sin objetivo',detail:'No hay objetivo guardado para este ejercicio.'};
  const sets=currentDoneSetsForPR(ex.id);
  if(!sets.length)return {status:'pending',label:'Pendiente',detail:'Marca series para evaluar el objetivo.'};
  const targetWeight=parseFloat(plan.targetWeight)||0;
  const minReps=parseInt(plan.minReps)||1;
  const maxReps=parseInt(plan.maxReps)||minReps;
  const targetSets=Math.max(1,parseInt(plan.targetSets)||1);
  const hits=sets.filter(s=>s.weight+0.001>=targetWeight&&s.reps>=minReps).length;
  const exceeded=sets.some(s=>s.weight>targetWeight+0.04||(s.weight+0.001>=targetWeight&&s.reps>maxReps));
  const maxW=Math.max(...sets.map(s=>s.weight));
  const bestRepsAtTarget=sets.filter(s=>s.weight+0.001>=targetWeight).reduce((a,s)=>Math.max(a,s.reps),0);
  if(exceeded)return {status:'exceeded',label:'Superado',detail:`Vas por encima del objetivo. Máx: ${maxW.toFixed(1)} kg · ${bestRepsAtTarget} reps.`};
  if(hits>=targetSets)return {status:'completed',label:'Cumplido',detail:`Objetivo cumplido: ${hits}/${targetSets} series en rango.`};
  return {status:'missed',label:'Por debajo',detail:`Llevas ${hits}/${targetSets} series objetivo. Sigue si la técnica es correcta.`};
}
function buildWorkoutGoalHtml(ex){
  const plan=progressionPlanFor(ex);
  if(!plan)return `<div class="progression-goal"><div class="progression-goal-top"><div class="progression-goal-title">Objetivo de progresión</div><span class="progression-goal-badge">Sin plan</span></div><div class="progression-goal-sub">No hay objetivo guardado. Puedes crearlo desde la ficha o dejar que se genere al guardar una sesión.</div><div class="progression-goal-actions"><button class="progression-mini-btn green" onclick="event.stopPropagation();openProgressionPlanModal('${ex.exerciseId||ex.id}','${esc(ex.name)}')">Crear objetivo</button></div></div>`;
  const st=currentGoalStatusForExercise(ex,plan);
  return `<div class="progression-goal ${st.status}">
    <div class="progression-goal-top"><div class="progression-goal-title">Objetivo de hoy</div><span class="progression-goal-badge ${st.status}">${st.label}</span></div>
    <div class="progression-goal-main">${esc(progressionTargetText(plan))}</div>
    <div class="progression-goal-sub">${esc(st.detail)}${plan.note?`<br>${esc(plan.note)}`:''}</div>
    <div class="progression-goal-actions">
      <button class="progression-mini-btn" onclick="event.stopPropagation();openProgressionPlanModal('${ex.exerciseId||ex.id}','${esc(ex.name)}')">Editar objetivo</button>
      <button class="progression-mini-btn" onclick="event.stopPropagation();clearProgressionPlan('${ex.exerciseId||ex.id}',true)">Quitar</button>
    </div>
  </div>`;
}
function makeProgressionPlanFromSets(ex,sets,status='pending',fromSessionId=null){
  const clean=(sets||[]).filter(s=>s&&s.weight&&s.reps);
  if(!clean.length)return null;
  const sum=summarizeExerciseSets(clean);
  if(!sum)return null;
  const range=parseRepsTargetRange(ex.repsTarget||ex.defaultReps||'');
  const maxW=sum.maxWeight;
  const inc=suggestedIncrement(maxW);
  const minDone=Math.min(...clean.map(s=>s.reps));
  const avg=clean.reduce((a,s)=>a+s.reps,0)/clean.length;
  let targetWeight=maxW;
  let minReps=range?range.min:Math.max(6,Math.round(avg));
  let maxReps=range?range.max:Math.max(minReps,Math.round(avg+2));
  let note='Objetivo generado automáticamente al guardar la sesión.';
  if(range){
    const topSets=clean.filter(s=>Math.abs(s.weight-maxW)<0.01);
    const topMin=topSets.length?Math.min(...topSets.map(s=>s.reps)):minDone;
    if(topSets.length>=2&&topMin>=range.max){
      targetWeight=maxW+inc;
      minReps=range.min;
      maxReps=range.max;
      note=`Subida prudente sugerida tras alcanzar el rango alto (${range.max} reps).`;
    }else if(minDone<range.min){
      targetWeight=maxW;
      note=`Consolida el rango ${range.min}-${range.max} antes de subir peso.`;
    }else{
      targetWeight=maxW;
      minReps=Math.min(range.max,Math.max(range.min,minDone+1));
      maxReps=range.max;
      note='Suma reps manteniendo el peso antes de subir.';
    }
  }else{
    if(avg>=15){
      targetWeight=maxW+inc;
      minReps=Math.max(8,Math.round(avg*0.65));
      maxReps=Math.max(minReps+2,Math.round(avg*0.8));
      note='Subida sugerida por media alta de reps.';
    }
  }
  const key=progressionKeyFrom(ex);
  return {
    id:'goal_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    exerciseKey:key,
    exerciseId:ex.exerciseId||ex.id||key,
    exerciseName:ex.name||'Ejercicio',
    targetWeight:Number(targetWeight.toFixed(2)),
    minReps,
    maxReps,
    targetSets:Math.max(1,clean.length),
    status:'pending',
    source:'auto',
    note,
    createdAt:Date.now(),
    updatedAt:Date.now(),
    fromSessionId
  };
}
function evaluateProgressionPlan(ex,sets,plan,sessionId){
  const clean=(sets||[]).filter(s=>s&&s.weight&&s.reps);
  if(!plan||!clean.length)return null;
  const targetWeight=parseFloat(plan.targetWeight)||0;
  const minReps=parseInt(plan.minReps)||1;
  const maxReps=parseInt(plan.maxReps)||minReps;
  const targetSets=Math.max(1,parseInt(plan.targetSets)||1);
  const hits=clean.filter(s=>s.weight+0.001>=targetWeight&&s.reps>=minReps).length;
  const exceeded=clean.some(s=>s.weight>targetWeight+0.04||(s.weight+0.001>=targetWeight&&s.reps>maxReps));
  const sum=summarizeExerciseSets(clean);
  let status='missed';
  if(exceeded)status='exceeded';
  else if(hits>=Math.min(targetSets,clean.length))status='completed';
  return {
    id:'prog_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    date:Date.now(),
    sessionId,
    exerciseKey:progressionKeyFrom(ex),
    exerciseId:ex.exerciseId||ex.id,
    exerciseName:ex.name,
    status,
    target:{weight:targetWeight,minReps,maxReps,targetSets},
    actual:{sets:clean.length,hits,volume:sum?sum.volume:0,maxWeight:sum?sum.maxWeight:0,best1rm:sum?sum.best1rm:0,totalReps:sum?sum.totalReps:0,line:sum?sum.line:''},
    note:status==='exceeded'?'Objetivo superado':status==='completed'?'Objetivo cumplido':'Objetivo no cumplido'
  };
}
function evaluateAndUpdateProgressionOnSave(entry,day,doneSets){
  const plans=getProgressionPlans();
  const hist=getProgressionHistory();
  const evaluations=[];
  (day?.exercises||[]).forEach(ex=>{
    const raw=(doneSets[ex.id]||[]).map(s=>({weight:parseFloat(s.weight)||0,reps:parseInt(s.reps)||0}));
    if(!raw.length)return;
    const key=progressionKeyFrom(ex);
    const prev=plans[key]||null;
    const ev=prev?evaluateProgressionPlan(ex,raw,prev,entry.id):null;
    if(ev){hist.push(ev);evaluations.push(ev);}
    const next=makeProgressionPlanFromSets(ex,raw,ev?ev.status:'pending',entry.id);
    if(next)plans[key]=next;
  });
  saveProgressionPlans(plans);
  saveProgressionHistory(hist.slice(-500));
  return evaluations;
}
function progressionStagnationForExercise(exOrId,name=''){
  const h=progressionHistoryFor(exOrId,name).slice(0,4);
  if(h.length<3)return '';
  const recent=h.slice(0,3);
  const misses=recent.filter(x=>x.status==='missed').length;
  if(misses>=2)return `Hay ${misses} objetivos no cumplidos en las últimas 3 evaluaciones. Revisa técnica, descanso o baja ligeramente el objetivo.`;
  const vals=recent.slice().reverse().map(x=>x.actual?.best1rm||0);
  if(vals.length>=3&&vals[2]<=vals[0]+0.05)return 'No hay mejora clara de 1RM estimado en las últimas evaluaciones. Puede haber estancamiento.';
  return '';
}

function finishSession(){
  const day=ROUTINE[S.dayIdx];
  if(!day){toast('No se pudo identificar el día de entrenamiento');return;}
  let vol=0; const exSum=[];
  visibleExercises(day).forEach(ex=>{
    const sets=(S.sessionSets[ex.id]||[]).filter(s=>s&&s.done);
    if(sets.length){
      const exVol=sets.reduce((a,s)=>a+(parseFloat(s.weight)||0)*(parseInt(s.reps)||0),0);
      vol+=exVol;
      exSum.push({name:ex.name,done:sets.length,maxW:Math.max(...sets.map(s=>parseFloat(s.weight)||0)),volume:exVol});
    }
  });
  const{done,total}=countDone();
  if(!done){toast('No hay series completadas para guardar');return;}

  openModal(`<div class="modal-hdr">Resumen<button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="fin-row"><span class="fin-lbl">Día</span><span class="fin-val">${day.name}</span></div>
    <div class="fin-row"><span class="fin-lbl">Duración</span><span class="fin-val">${fmt(S.workoutElapsed)}</span></div>
    <div class="fin-row"><span class="fin-lbl">Series</span><span class="fin-val">${done}/${total}</span></div>
    <div class="fin-row"><span class="fin-lbl">Volumen</span><span class="fin-val">${vol.toFixed(0)} kg</span></div>
    ${exSum.map(e=>`<div class="fin-row"><span class="fin-lbl" style="font-size:11px">${e.name}</span><span class="fin-val" style="font-size:11px">${e.done} ser · ${e.maxW}kg · ${e.volume.toFixed(0)}kg</span></div>`).join('')}
    <button class="btn btn-success" style="margin-top:14px" onclick="saveSession()">Guardar entrenamiento</button>
    <button class="btn btn-ghost" onclick="closeModal()" style="margin-top:0">Seguir entrenando</button>`);
}

function cloneSessionSetsSafe(){
  try{return JSON.parse(JSON.stringify(S.sessionSets||{}));}
  catch{return {...(S.sessionSets||{})};}
}
function doneOnlySets(rawSets){
  const out={};
  Object.keys(rawSets||{}).forEach(exId=>{
    const done=(rawSets[exId]||[]).filter(s=>s&&s.done).map(s=>({
      weight:String(s.weight??''),
      reps:String(s.reps??''),
      done:true
    }));
    if(done.length)out[exId]=done;
  });
  return out;
}
function sessionVolumeFromSets(sets){
  let vol=0;
  Object.values(sets||{}).forEach(arr=>(arr||[]).forEach(s=>{vol+=(parseFloat(s.weight)||0)*(parseInt(s.reps)||0);}));
  return vol;
}
function sessionExerciseSnapshot(day,sets){
  const exById=new Map((day?.exercises||[]).map(ex=>[String(ex.id),ex]));
  return Object.keys(sets||{}).map(exId=>{
    const ex=exById.get(String(exId))||allKnownExercises().find(e=>String(e.id)===String(exId))||{id:exId,name:exId};
    return {id:ex.id,exerciseId:ex.exerciseId||ex.id,name:ex.name,muscleGroup:ex.muscleGroup||'all',primaryMuscle:ex.primaryMuscle||'',equipment:ex.equipment||'',type:ex.type||''};
  });
}
function saveSession(){
  const day=ROUTINE[S.dayIdx];
  if(!day){toast('No se pudo guardar: día no encontrado');return;}

  const rawSnapshot=cloneSessionSetsSafe();
  const doneSets=doneOnlySets(rawSnapshot);
  const doneCount=Object.values(doneSets).reduce((a,arr)=>a+arr.length,0);
  if(!doneCount){toast('No hay series completadas para guardar');return;}

  const volume=sessionVolumeFromSets(doneSets);
  const entry={
    id:Date.now(),
    routineId:getActiveRoutineId(),
    routineName:getActiveRoutinePlan()?.name||'',
    dayId:day.id,
    dayName:day.name,
    date:Date.now(),
    duration:S.workoutElapsed||0,
    volume,
    sets:doneSets,
    exercises:sessionExerciseSnapshot(day,doneSets)
  };
  entry.progression=evaluateAndUpdateProgressionOnSave(entry,day,doneSets);

  try{
    const history=gs('history')||[];
    history.push(entry);
    gw('history',history);

    const check=gs('history')||[];
    if(!check.some(h=>String(h.id)===String(entry.id))){
      throw new Error('No se confirmó el guardado en historial');
    }

    gw('lastSavedSession',entry);
    discardSession(false);
    closeModal();
    S.page='history';
    toast('✅ Entrenamiento guardado en Historial');
    render();
  }catch(err){
    console.error(err);
    toast('No se pudo guardar. La sesión sigue activa.');
  }
}

function historyExerciseEntries(h){
  const sets=h?.sets||{};

  return Object.keys(sets).map(exId=>{

      exerciseId:ex.exerciseId||ex.profileId||ex.id||exId,

function dateInputTs(v,end=false){
  if(!v)return null;
  const t=new Date(v+(end?'T23:59:59':'T00:00:00')).getTime();
  return isNaN(t)?null:t;
}
function filterHistorySessions(history){
  const f=S.historyFilter||{};
  const q=String(f.q||'').toLowerCase().trim();
  const from=dateInputTs(f.from,false);
  const to=dateInputTs(f.to,true);
  const muscle=f.muscle||'all';
  return history.filter(h=>{
    if(q&&!historySessionText(h).includes(q))return false;
    if(from&&h.date<from)return false;
    if(to&&h.date>to)return false;
    if(muscle!=='all'){
      const ok=historyExerciseEntries(h).some(ex=>(ex.muscleGroup===muscle||ex.primaryMuscle===muscle)&&(h.sets?.[ex.id]||[]).some(s=>s.done));
      if(!ok)return false;
    }
    return true;
  });
}
function datetimeLocalValue(ts){
  const d=new Date(ts||Date.now());
  const off=d.getTimezoneOffset();
  const local=new Date(d.getTime()-off*60000);
  return local.toISOString().slice(0,16);
}
function datetimeLocalTs(v,backup){
  if(!v)return backup||Date.now();
  const t=new Date(v).getTime();
  return isNaN(t)?(backup||Date.now()):t;
}

function addHistorySet(id,exId){

function duplicateHistorySession(id){
